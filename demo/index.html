<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L3Hub · 界面原型</title>
<!--
  尺寸、文案、配色都摘自本仓库 app/src/main/java/me/rerere/rikkahub/ 的字面量，
  不是照 web-ui/ 或 web/ 复写的。逐条出处见 .l3spec/{chat,drawer,settings-theme,layout-panes}.md。

  已知取舍：
  1. 横屏三栏在原应用里整块按 density × 0.75 缩放；这里的视口远宽于手机横屏，
     1:1 的 dp→px 更易读，所以没套 0.75（结构、比例、阈值仍照代码）。
  2. 图标是 24×24 描边 SVG 近似（原应用全部用 me.rerere.hugeicons）。
  3. 颜色取 themeId = sakura 的手写方案（ui/theme/presets/SakuraTheme.kt）；
     出厂默认的 dynamicColor 跟壁纸走，没有固定十六进制。
  4. 设置分区只把「偏好设置 → 主题」这一条下钻做完整，其余分区标注未收录，不编内容。
-->
<style>
/* ============ 1. 设计 token：sakura（逐角色写死的唯一完整配色） ============ */
:root{
  --ease-alpha: cubic-bezier(.4,.4,.17,.9);
  --ease-fancy: cubic-bezier(.48,.19,.05,1.03);
  --ease-p2p: cubic-bezier(.55,.55,0,1);
  --dur: 300ms;

  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px;
  --r-bubble: 24px; --r-bubble-tail: 6px;

  --font: "Noto Sans SC","PingFang SC","Source Han Sans SC","HarmonyOS Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono: "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* 位置槽 → 角色（UiSlots.kt uiSlotsFrom） */
  --page-bg: var(--background);
  --topbar: var(--surface-container);
  --list-item: var(--surface-bright);
  --input-bar: var(--surface-container-low);
  --ai-bubble: var(--surface-container-high);
  --user-bubble: var(--primary-container);
}
html[data-theme="light"]{
  --primary:#8E4955; --on-primary:#FFFFFF; --primary-container:#FFD9DD; --on-primary-container:#72333E;
  --secondary:#76565A; --on-secondary:#FFFFFF; --secondary-container:#FFD9DD; --on-secondary-container:#5C3F43;
  --tertiary:#785831; --on-tertiary:#FFFFFF; --tertiary-container:#FFDDB8; --on-tertiary-container:#5E411C;
  --error:#BA1A1A; --on-error:#FFFFFF; --error-container:#FFDAD6; --on-error-container:#93000A;
  --background:#FFF8F7; --on-background:#22191A;
  --surface:#FFF8F7; --on-surface:#22191A;
  --surface-variant:#F3DDDF; --on-surface-variant:#524345;
  --outline:#847374; --outline-variant:#D7C1C3;
  --surface-dim:#E7D6D7; --surface-bright:#FFF8F7;
  --surface-container-lowest:#FFFFFF; --surface-container-low:#FFF0F1;
  --surface-container:#FBEAEB; --surface-container-high:#F6E4E5; --surface-container-highest:#F0DEDF;
  --inverse-surface:#382E2F; --inverse-on-surface:#FEEDED; --inverse-primary:#FFB2BC;
  --scrim:#000000;
  --mesh-0:#EAE4F8; --mesh-1:#F4F0FC; --mesh-2:#FBF9FF; --mesh-3:#FFFFFF; --mesh-4:#FFFFFF;
  --shadow-1: 0 1px 2px rgba(34,25,26,.06), 0 2px 8px rgba(34,25,26,.05);
  --shadow-2: 0 12px 32px rgba(34,25,26,.12), 0 2px 6px rgba(34,25,26,.06);
  --glass: rgba(255,248,247,.72);
}
html[data-theme="dark"]{
  --primary:#FFB2BC; --on-primary:#561D28; --primary-container:#72333E; --on-primary-container:#FFD9DD;
  --secondary:#E5BDC1; --on-secondary:#43292D; --secondary-container:#5C3F43; --on-secondary-container:#FFD9DD;
  --tertiary:#EABF8F; --on-tertiary:#452B07; --tertiary-container:#5E411C; --on-tertiary-container:#FFDDB8;
  --error:#FFB4AB; --on-error:#690005; --error-container:#93000A; --on-error-container:#FFDAD6;
  --background:#1A1112; --on-background:#F0DEDF;
  --surface:#1A1112; --on-surface:#F0DEDF;
  --surface-variant:#524345; --on-surface-variant:#D7C1C3;
  --outline:#9F8C8E; --outline-variant:#524345;
  --surface-dim:#1A1112; --surface-bright:#413738;
  --surface-container-lowest:#140C0D; --surface-container-low:#22191A;
  --surface-container:#261D1E; --surface-container-high:#312828; --surface-container-highest:#3D3233;
  --inverse-surface:#F0DEDF; --inverse-on-surface:#382E2F; --inverse-primary:#8E4955;
  --scrim:#000000;
  --mesh-0:#191428; --mesh-1:#141020; --mesh-2:#0D0A15; --mesh-3:#09070E; --mesh-4:#07060A;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.28);
  --shadow-2: 0 14px 36px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.36);
  --glass: rgba(38,29,30,.72);
}

/* ============ 2. 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; font-family:var(--font); background:var(--surface-dim); color:var(--on-surface);
  -webkit-font-smoothing:antialiased; overflow:hidden}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input,textarea{font:inherit; color:inherit}
::selection{background:var(--primary); color:var(--on-primary)}
.icon{width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; display:block}
.icon.s20{width:20px;height:20px}
.icon.s18{width:18px;height:18px}
.icon.s16{width:16px;height:16px}
.icon.s14{width:14px;height:14px}
.icon.s12{width:12px;height:12px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin;
  scrollbar-color:var(--outline-variant) transparent}
.scroll::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--outline-variant); border-radius:3px}

.t-title-lg{font-size:22px;line-height:28px}
.t-title-md{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.t-title-sm{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.t-body-lg{font-size:16px;line-height:24px;letter-spacing:.5px}
.t-body-md{font-size:14px;line-height:20px;letter-spacing:.25px}
.t-body-sm{font-size:12px;line-height:16px;letter-spacing:.4px}
.t-label-lg{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.t-label-md{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.t-label-sm{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px}
.dim{color:var(--on-surface-variant)}

/* ============ 3. 设备与外壳 ============ */
#stage{position:fixed; inset:0; display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(1000px 520px at 18% 8%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 62%),
    radial-gradient(900px 500px at 82% 92%, color-mix(in srgb, var(--tertiary) 14%, transparent), transparent 60%),
    var(--surface-dim)}
#device{position:relative; width:min(430px,100%); height:min(932px,100%); overflow:hidden;
  border-radius:32px; background:var(--page-bg); box-shadow:var(--shadow-2); display:flex; isolation:isolate}
body[data-mode="wide"] #stage{padding:0; display:block}
body[data-mode="wide"] #device{width:100%; height:100%; border-radius:0; box-shadow:none}
#app{position:relative; display:flex; width:100%; height:100%; min-width:0; overflow:hidden}
#shell{display:flex; flex:1; min-width:0; height:100%; position:relative}
#mesh{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:linear-gradient(180deg,var(--mesh-0) 0%,var(--mesh-1) 22%,var(--mesh-2) 45%,var(--mesh-3) 65%,var(--mesh-4) 100%)}
#mesh::before,#mesh::after{content:""; position:absolute; inset:-15%; border-radius:50%;
  filter:blur(38px); opacity:.55; will-change:transform}
#mesh::before{
  background:
    radial-gradient(closest-side, color-mix(in srgb, #7C6CF0 62%, transparent), transparent 72%) 26% 12%/52% 46% no-repeat,
    radial-gradient(closest-side, color-mix(in srgb, #4FC3D9 54%, transparent), transparent 72%) 74% 30%/44% 40% no-repeat;
  animation:driftA 7000ms ease-in-out infinite alternate}
#mesh::after{
  background:
    radial-gradient(closest-side, color-mix(in srgb, #D96CC0 52%, transparent), transparent 72%) 68% 8%/46% 42% no-repeat,
    radial-gradient(closest-side, color-mix(in srgb, #F2A26B 44%, transparent), transparent 72%) 52% 34%/40% 38% no-repeat;
  animation:driftB 8500ms ease-in-out infinite alternate}
html[data-theme="light"] #mesh::before,html[data-theme="light"] #mesh::after{opacity:.42; filter:blur(44px)}
@keyframes driftA{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
@keyframes driftB{from{transform:translate3d(2%,1%,0) scale(1.06)}to{transform:translate3d(-3%,-2%,0) scale(1)}}

.col{display:flex; flex-direction:column; min-width:0; min-height:0}
.row{display:flex; align-items:center; min-width:0}

/* ============ 4. 原语 ============ */
.tb-btn{width:45px; height:45px; border-radius:50%; background:var(--surface-container-low);
  display:grid; place-items:center; color:var(--on-surface); box-shadow:var(--shadow-1);
  transition:background var(--dur) var(--ease-alpha), transform 140ms var(--ease-p2p)}
.tb-btn:hover{background:var(--surface-container-high)}
.tb-btn:active{transform:scale(.94)}
.tb-btn.on{color:var(--primary); background:var(--primary-container)}
.capsule{height:45px; border-radius:50px; background:var(--surface-container-low);
  display:flex; align-items:center; box-shadow:var(--shadow-1); overflow:hidden; flex:none}
.capsule .seg{display:flex; align-items:center; gap:4px; height:100%; padding:0 8px; color:var(--on-surface)}
.capsule .seg:hover{background:var(--surface-container-high)}
.capsule .cap-div{width:1px; height:18px; flex:none; background:var(--outline-variant); opacity:.6}
.capsule .name{font-size:14px; line-height:20px; font-weight:500; max-width:110px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; color:var(--on-surface-variant)}
.btn{height:38px; padding:0 16px; border-radius:50px; font-size:14px; font-weight:500;
  display:inline-flex; align-items:center; gap:8px}
.btn.tonal{background:var(--secondary-container); color:var(--on-secondary-container)}
.btn.primary{background:var(--primary); color:var(--on-primary)}
.btn.text{color:var(--primary); padding:0 10px}
.btn:active{transform:scale(.97)}
.switch{position:relative; width:52px; height:32px; border-radius:16px; flex:none;
  background:var(--surface-container-highest); border:2px solid var(--outline);
  transition:background var(--dur) var(--ease-alpha), border-color var(--dur) var(--ease-alpha)}
.switch::after{content:""; position:absolute; top:50%; left:6px; width:16px; height:16px; border-radius:50%;
  background:var(--outline); transform:translateY(-50%);
  transition:left var(--dur) var(--ease-p2p), width 180ms var(--ease-p2p), height 180ms var(--ease-p2p), background var(--dur) var(--ease-alpha)}
.switch[aria-checked="true"]{background:var(--primary); border-color:var(--primary)}
.switch[aria-checked="true"]::after{left:26px; width:24px; height:24px; background:var(--on-primary)}
.segmented{display:flex; background:var(--surface-container-high); border-radius:50px; padding:3px; gap:2px}
.segmented button{flex:1; height:34px; border-radius:50px; font-size:13px; font-weight:500;
  color:var(--on-surface-variant); display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background var(--dur) var(--ease-alpha), color var(--dur) var(--ease-alpha)}
.segmented button[aria-pressed="true"]{background:var(--primary); color:var(--on-primary); flex:1.3}
.menu{position:absolute; z-index:60; min-width:196px; padding:8px 0; border-radius:var(--r-xs);
  background:var(--surface-container); box-shadow:var(--shadow-2);
  transform-origin:top right; animation:menuIn 180ms var(--ease-fancy)}
@keyframes menuIn{from{opacity:0; transform:scale(.9)}to{opacity:1; transform:scale(1)}}
.menu .mi{display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px; font-size:14px;
  line-height:20px; color:var(--on-surface); text-align:left}
.menu .mi:hover{background:color-mix(in srgb, var(--on-surface) 7%, transparent)}
.menu .mi.danger{color:var(--error)}
.menu .mi[disabled]{opacity:.38; pointer-events:none}
.menu .sep{height:1px; margin:6px 0; background:var(--outline-variant)}
.menu .mh{padding:8px 16px; font-size:12px; font-weight:500; color:var(--on-surface-variant)}

/* ============ 5. 侧边抽屉 / 宽屏左栏（ChatDrawer.kt，一份内容两用） ============ */
#scrim{position:absolute; inset:0; z-index:15; background:var(--scrim); opacity:0;
  pointer-events:none; transition:opacity var(--dur) var(--ease-alpha)}
body[data-drawer="open"] #scrim{opacity:.32; pointer-events:auto}
#drawer{display:flex; flex-direction:column; gap:8px; padding:8px; flex:none;
  background:var(--surface-container-low); overflow:hidden; z-index:16;
  border-radius:0} /* RectangleShape：横屏它是一列常驻边，不是浮卡 */
body[data-mode="portrait"] #drawer{position:absolute; top:0; bottom:0; left:0; width:min(360px,100%);
  transform:translateX(-100%); transition:transform var(--dur) var(--ease-fancy); box-shadow:var(--shadow-2)}
body[data-mode="portrait"][data-drawer="open"] #drawer{transform:none}
body[data-mode="wide"] #drawer{width:300px}
body[data-mode="wide"][data-sidebar="closed"] #drawer{display:none}

.dw-hint{display:flex; align-items:center; gap:8px; padding:2px 4px 0; color:var(--on-surface-variant)}
.dw-block{border-radius:var(--r-md); background:color-mix(in srgb, var(--surface-container-low) 60%, transparent);
  overflow:hidden}
.dw-entry{display:flex; align-items:center; gap:12px; width:100%; padding:10px 8px;
  border-radius:var(--r-md); background:var(--surface-container-low); text-align:left}
.dw-entry:hover{background:var(--surface-container-high)}
.dw-entry span{font-size:14px; line-height:20px; letter-spacing:.25px}
.dw-entry .trail{margin-left:auto; width:32px; height:32px; display:grid; place-items:center;
  border-radius:50%; color:var(--on-surface-variant)}
.dw-entry .trail:hover{background:var(--surface-container-high)}
.dw-sec-head{display:flex; align-items:center; gap:6px; padding:6px 8px; color:var(--on-surface-variant)}
.dw-sec-head .t{flex:1; font-size:12px; font-weight:500; letter-spacing:.5px}
.dw-sec-head button{width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
  background:var(--surface-container-low)}
.dw-sec-head button:hover{background:var(--surface-container-high)}

/* 会话分组头：文件夹 / 置顶 / 周（labelLarge 粗体 primary） */
.fold{display:flex; align-items:center; gap:6px; width:100%; padding:8px; border-radius:12px;
  color:var(--primary); text-align:left}
.fold:hover{background:color-mix(in srgb, var(--primary) 8%, transparent)}
.fold .n{flex:1; font-size:14px; line-height:20px; font-weight:700; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.fold .c{font-size:12px; line-height:16px; font-weight:500; color:var(--on-surface-variant)}
.pin-head{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:12px;
  background:var(--surface-container-low); color:var(--primary); font-size:14px; font-weight:700}

/* 会话条目：只有标题 + 置顶针 12dp + 生成中 4dp 绿点，没有时间/预览/未读（ConversationItem） */
.conv{display:flex; align-items:center; gap:6px; width:100%; padding:6px 12px; border-radius:50px;
  text-align:left; color:var(--on-surface)}
.conv:hover{background:color-mix(in srgb, var(--on-surface) 6%, transparent)}
.conv[aria-current="true"]{background:var(--surface-bright); box-shadow:var(--shadow-1)}
.conv .t{flex:1; min-width:0; font-size:16px; line-height:24px; letter-spacing:.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.conv .pin{color:var(--primary)}
.conv .live{width:4px; height:4px; border-radius:50%; background:#00B42A; flex:none}

/* 助手切换行（AssistantPicker：NavigationDrawerItem 56dp） */
.assist{display:flex; align-items:center; gap:12px; width:100%; height:56px; padding:0 16px;
  border-radius:14px; text-align:left}
.assist:hover{background:color-mix(in srgb, var(--on-surface) 6%, transparent)}
.assist .n{flex:1; font-size:14px; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 底部：新聊天胶囊（52dp，绘制缩 0.8，锚点左下）+ 用户头像（52dp，锚点右下） */
.dw-bottom{display:flex; align-items:center; gap:10px; padding:6px 8px 2px}
.new-chat{flex:1; height:52px; border-radius:50px; background:var(--primary-container);
  color:var(--on-primary-container); display:flex; align-items:center; gap:10px; padding:0 18px;
  transform:scale(.8); transform-origin:left bottom; box-shadow:var(--shadow-1)}
.new-chat .t{font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.me{width:52px; height:52px; border-radius:50%; transform:scale(.8); transform-origin:right bottom;
  background:var(--tertiary-container); color:var(--on-tertiary-container); display:grid; place-items:center;
  font-size:18px; font-weight:500; flex:none}

/* ============ 6. 聊天顶栏（ChatTopBar.kt） ============ */
#chatcol{flex:1; min-width:0; display:flex; flex-direction:column; position:relative; z-index:2}
body[data-mode="wide"] #chatcol{max-width:40%; min-width:320px}
#topbar{display:flex; align-items:center; gap:6px; padding:6px 12px 6px 12px; flex:none}
#topbar .grow{flex:1; min-width:0}
#topbar .right{display:flex; align-items:center; gap:6px; margin-left:auto; padding-left:6px}
#title-pill{flex:1; min-width:0; margin:0 6px}
#title-pill .seg{min-width:0}
#title-pill .name{max-width:none}
body[data-mode="portrait"] .wide-only{display:none}
body[data-mode="wide"] .narrow-only{display:none}

/* 供应商配额条（ChatQuotaStrip：整宽、圆角 20dp、h14 v9） */
#quota{flex:none; padding:0 12px 6px}
#quota .box{display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:20px;
  background:var(--surface-container-low); box-shadow:var(--shadow-1)}
#quota .main{min-width:0; flex:1}
#quota .p{font-size:14px; line-height:20px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#quota .sub{font-size:11px; line-height:16px; color:var(--on-surface-variant); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
#quota .bal{display:flex; align-items:center; gap:4px; font-size:12px; line-height:16px; font-weight:500;
  color:var(--on-surface-variant); flex:none}

/* ============ 7. 消息列表（ChatList.kt / ChatMessage.kt） ============ */
#list{flex:1; min-height:0; padding:16px 16px 32px; display:flex; flex-direction:column}
.msg{display:flex; flex-direction:column; gap:4px; margin-top:2px}
.msg.role-change{margin-top:16px}
.msg.user{align-items:flex-end}
.msg.ai{align-items:flex-start}
.mhead{display:flex; align-items:center; gap:8px; width:100%}
.msg.user .mhead{justify-content:flex-end}
.avatar{width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:12px; font-weight:500; background:var(--tertiary-container); color:var(--on-tertiary-container)}
.avatar.ai{background:var(--primary-container); color:var(--on-primary-container)}
.mname{font-size:14px; line-height:20px; font-weight:500; letter-spacing:.1px}

/* 气泡：用户 primaryContainer / 助手 surfaceContainerHigh；尾巴角 6dp，其余 24dp */
.bubble{max-width:100%; padding:10px; font-size:16px; line-height:24px; letter-spacing:.5px;
  overflow-wrap:anywhere; color:var(--on-surface)}
.msg.user .bubble{max-width:86%; margin-left:24px; background:var(--user-bubble);
  color:var(--on-primary-container);
  border-radius:var(--r-bubble) var(--r-bubble-tail) var(--r-bubble) var(--r-bubble)}
.msg.ai .bubble{background:var(--ai-bubble);
  border-radius:var(--r-bubble-tail) var(--r-bubble) var(--r-bubble) var(--r-bubble)}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble h3{font-size:16px; line-height:24px; margin:12px 0 6px; font-weight:500}
.bubble ul{margin:4px 0 8px; padding-left:20px}
.bubble li{margin:2px 0}
.bubble code{font-family:var(--mono); font-size:13px; padding:1px 5px; border-radius:6px;
  background:color-mix(in srgb, var(--on-surface) 8%, transparent)}
.bubble a{color:var(--primary)}
.code{margin:8px 0; border-radius:var(--r-md); background:var(--surface-container-lowest);
  border:1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent); overflow:hidden}
.code .cbar{display:flex; align-items:center; gap:6px; padding:6px 10px; font-size:11px; line-height:16px;
  color:var(--on-surface-variant); background:color-mix(in srgb, var(--on-surface) 4%, transparent)}
.code pre{margin:0; padding:10px; overflow-x:auto; font-family:var(--mono); font-size:12px; line-height:18px}
.tk-k{color:var(--tertiary)} .tk-s{color:#8FD48B} .tk-c{color:var(--on-surface-variant)}

/* 思考 / 工具折叠卡（ChainOfThought：圆角 20dp，内边距 h12 v4） */
.chain{background:var(--ai-bubble); border-radius:20px; padding:4px 12px; margin:2px 0}
.step{display:flex; align-items:center; gap:8px; padding:8px 0; width:100%; text-align:left}
.step .ic{width:24px; flex:none; display:grid; place-items:center; color:var(--secondary)}
.step .t{flex:1; min-width:0; font-size:14px; line-height:20px; font-weight:500; letter-spacing:.1px;
  color:var(--secondary); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.step .dur{font-size:11px; line-height:16px; color:var(--secondary); min-width:40px; text-align:right;
  font-family:var(--mono); flex:none}
.step .chev{color:var(--on-surface-variant); flex:none; transition:transform 200ms var(--ease-p2p)}
.step[aria-expanded="true"] .chev{transform:rotate(180deg)}
.prog{height:3px; border-radius:2px; background:color-mix(in srgb, var(--secondary) 15%, transparent);
  margin:0 2px 8px 32px; overflow:hidden; position:relative}
.prog i{position:absolute; inset:0 auto 0 0; width:var(--v,100%); border-radius:2px;
  background:var(--secondary); transition:width 600ms var(--ease-alpha)}
.prog.run i{background-image:repeating-linear-gradient(90deg,transparent 0 6px,
  color-mix(in srgb, var(--secondary) 45%, transparent) 6px 12px);
  animation:flow 900ms linear infinite}
@keyframes flow{to{background-position:12px 0}}
.detail{padding:0 0 8px 32px; font-size:12px; line-height:18px; color:var(--on-surface-variant);
  display:none}
.detail.open{display:block; animation:expandIn 220ms var(--ease-fancy)}
@keyframes expandIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.detail .kv{display:flex; gap:8px; padding:2px 0}
.detail .kv b{font-weight:500; color:var(--on-surface); min-width:64px; flex:none}
.detail .kv span{font-family:var(--mono); font-size:11px; overflow-wrap:anywhere}
.reason-prev{max-height:100px; overflow:hidden; position:relative}
.reason-prev::after{content:""; position:absolute; inset:auto 0 0 0; height:40px;
  background:linear-gradient(transparent, var(--ai-bubble))}
.reason-prev p{margin:0 0 6px}
.chain .more{display:flex; align-items:center; gap:8px; padding:4px 0; width:100%;
  color:var(--primary); font-size:12px; font-weight:500; letter-spacing:.5px}
.chain .more .ic{width:24px; display:grid; place-items:center}

/* 助手操作行（FlowRow spacedBy 4dp，图标 18dp，tint onSurfaceVariant） */
.actions{display:flex; align-items:center; gap:4px; padding-top:2px; flex-wrap:wrap}
.actions button{width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  color:var(--on-surface-variant)}
.actions button:hover{background:color-mix(in srgb, var(--on-surface) 8%, transparent)}
.actions .branch{display:flex; align-items:center; gap:2px; font-size:12px; color:var(--on-surface-variant);
  padding:0 4px; font-variant-numeric:tabular-nums}
.actions .time{font-size:11px; line-height:16px; color:var(--on-surface-variant); opacity:.6; padding:0 4px}

/* 统计行（ChatMessageNerdLine：labelSmall，secondary 50%，等宽数字） */
.nerd{font-size:11px; line-height:16px; color:color-mix(in srgb, var(--secondary) 60%, transparent);
  padding:2px 4px; border-radius:8px; display:flex; flex-direction:column; gap:2px;
  font-family:var(--mono)}
.nerd .r{display:flex; align-items:center; gap:4px}
.nerd .r .icon{width:11px;height:11px}

/* 文件变更卡（EditedFilesList：surfaceContainerLow，shapes.large） */
.edited{background:var(--surface-container-low); border-radius:var(--r-lg); margin-top:2px; overflow:hidden}
.edited .h{display:flex; align-items:center; gap:8px; padding:10px 12px; width:100%; text-align:left}
.edited .h .t{font-size:14px; line-height:20px; font-weight:500; color:var(--on-surface-variant)}
.edited .h .c{font-size:12px; line-height:16px; font-weight:500; color:var(--primary)}
.edited .h .chev{margin-left:auto; color:var(--on-surface-variant); transition:transform 200ms var(--ease-p2p)}
.edited[aria-expanded="true"] .h .chev{transform:rotate(180deg)}
.edited .body{display:none; padding:0 8px 8px; font-size:12px; line-height:16px}
.edited[aria-expanded="true"] .body{display:block}
.edited .f{display:flex; align-items:center; gap:6px; padding:3px 4px; color:var(--on-surface-variant);
  font-family:var(--mono); font-size:11px}
.edited .f .add{color:#3FA45B} .edited .f .del{color:var(--error)}

/* 子代理回传卡（ChatMessageSubAgentNotice） */
.notice{margin-top:2px; width:100%}
.notice .h{display:flex; align-items:center; gap:6px; padding:2px 12px; width:100%; text-align:left}
.notice .h .t{font-size:12px; line-height:16px; font-weight:500; color:var(--primary)}
.notice .h .s{font-size:11px; line-height:16px; color:var(--on-surface-variant); flex:1; text-align:left}
.notice .body{display:none; margin-top:6px; padding:10px 12px; border-radius:var(--r-md);
  background:var(--surface-container-low); font-size:12px; line-height:18px; color:var(--on-surface)}
.notice[aria-expanded="true"] .body{display:block}
.notice .h .chev{color:var(--on-surface-variant); transition:transform 200ms var(--ease-p2p)}
.notice[aria-expanded="true"] .h .chev{transform:rotate(180deg)}

/* 生成中（LoadingIndicatorKey：28dp 指示器 + 状态文本） */
.loading{display:flex; align-items:center; gap:8px; padding:16px 8px 8px}
.loading .sp{width:28px; height:28px; border-radius:50%; flex:none;
  border:3px solid color-mix(in srgb, var(--primary) 22%, transparent);
  border-top-color:var(--primary); animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .s{font-size:12px; line-height:16px; font-weight:500; color:var(--on-surface-variant)}

/* ============ 8. 输入区（ChatInput.kt / ContextUsageMeter.kt） ============ */
#composer{position:relative; flex:none; padding:0 8px 8px; display:flex; flex-direction:column; gap:8px; z-index:5}
#composer::before{content:""; position:absolute; inset:-40px 0 0; pointer-events:none; z-index:-1;
  background:linear-gradient(transparent, color-mix(in srgb, var(--page-bg) 88%, transparent))}
#meter{padding:4px; display:flex; flex-direction:column; gap:4px}
.meter-row{display:flex; align-items:center; gap:8px}
.meter-row .lb{font-size:11px; line-height:16px; font-weight:500; letter-spacing:.5px; min-width:34px;
  color:var(--on-surface-variant)}
.meter-row .track{flex:1; height:6px; border-radius:3px; overflow:hidden; position:relative;
  background:color-mix(in srgb, var(--on-surface) 18%, transparent)}
.meter-row .track i{position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--primary);
  transition:width 400ms var(--ease-alpha)}
.meter-row .val{font-family:var(--mono); font-size:12px; line-height:16px; font-weight:500; min-width:128px;
  text-align:right; color:var(--on-surface-variant); font-variant-numeric:tabular-nums}
.meter-row[data-level="alert"] .track i{background:var(--tertiary)}
.meter-row[data-level="alert"] .val{color:var(--tertiary)}
.meter-row[data-level="max"] .track i{background:var(--error)}
.meter-row[data-level="max"] .val{color:var(--error)}

#card{background:var(--input-bar); border-radius:var(--r-xl);
  border:1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent);
  padding:4px 12px; display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow-1)}
#input{width:100%; border:0; outline:0; resize:none; background:transparent; font-size:16px;
  line-height:24px; letter-spacing:.5px; padding:10px 0; max-height:144px; min-height:44px;
  color:var(--on-surface)}
#input::placeholder{color:var(--on-surface-variant)}
.iactions{display:flex; align-items:center; gap:4px; padding:0 4px 4px}
.iactions .grow{flex:1}
.iact{width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  color:var(--on-surface-variant); background:transparent}
.iact:hover{background:color-mix(in srgb, var(--on-surface) 8%, transparent)}
.iact.model{color:var(--on-surface)}
#sendbtn{width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  background:var(--primary); color:var(--on-primary); box-shadow:var(--shadow-1);
  transition:background 200ms var(--ease-alpha), color 200ms var(--ease-alpha)}
#sendbtn[data-state="disabled"]{background:var(--surface-container-high);
  color:color-mix(in srgb, var(--on-surface) 38%, transparent)}
#sendbtn[data-state="stop"]{background:var(--error-container); color:var(--on-error-container)}


/* ============ 9. 右侧面板（ChatSidePanel.kt：圆角 24dp，玻璃，标签条 38dp） ============ */
#pane{display:none}
body[data-mode="wide"] #pane{display:flex; flex:none; width:auto; flex:1; min-width:260px;
  padding:8px 8px 8px 4px; min-height:0}
.pane-card{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;
  border-radius:24px; background:var(--glass); backdrop-filter:blur(24px) saturate(1.1);
  box-shadow:var(--shadow-1); border:1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent)}
.pane-tabs{display:flex; align-items:center; gap:4px; padding:6px 4px 0 8px; flex:none}
.pane-tabs .tabs{display:flex; gap:4px; overflow-x:auto; flex:1; scrollbar-width:none}
.pane-tabs .tabs::-webkit-scrollbar{display:none}
.tab{display:flex; align-items:center; gap:2px; height:38px; min-width:104px; max-width:200px;
  padding:0 2px 0 14px; border-radius:12px; color:var(--on-surface-variant); flex:none}
.tab .t{flex:1; min-width:0; font-size:14px; line-height:20px; font-weight:500; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface-container-high); color:var(--primary)}
.tab .x{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; flex:none}
.tab .x:hover{background:color-mix(in srgb, var(--on-surface) 10%, transparent)}
.pane-tabs .plus{width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  color:var(--on-surface); flex:none}
.pane-tabs .plus:hover{background:var(--surface-container-high)}
.pane-body{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.pane-scroll{flex:1; min-height:0; padding:10px 10px 14px 16px; display:flex; flex-direction:column; gap:12px}
.dsec{display:flex; flex-direction:column; gap:6px}
.dsec > .h{font-size:14px; line-height:20px; font-weight:500; color:var(--on-surface)}
.drow{display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:20px}
.drow .lb{width:52px; flex:none; color:var(--on-surface-variant); font-size:12px; line-height:20px}
.drow .v{flex:1; min-width:0; overflow-wrap:anywhere}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{padding:4px 10px; border-radius:50px; background:var(--surface-container-high);
  font-size:12px; line-height:16px; font-weight:500; color:var(--on-surface-variant)}
.chip.prim{background:var(--primary-container); color:var(--on-primary-container)}
.mini-code{margin:0; padding:8px 10px; border-radius:10px; background:var(--surface-container-low);
  font-family:var(--mono); font-size:11px; line-height:16px; color:var(--on-surface-variant);
  overflow:auto; max-height:180px; white-space:pre-wrap}
.empty-pane{flex:1; display:grid; place-content:center; padding:24px; text-align:center; gap:6px}

/* 任务树：左 140dp 平铺代理关系，右侧选中详情 */
.tree{flex:1; min-height:0; display:flex; gap:0}
.tree .left{width:140px; flex:none; padding:8px; display:flex; flex-direction:column; gap:4px; overflow-y:auto}
.tree .split{width:1px; background:var(--outline-variant); opacity:.7}
.tree .right{flex:1; min-width:0; padding:12px; display:flex; flex-direction:column; gap:8px; overflow-y:auto}
.agent{padding:6px 6px; border-radius:10px; background:var(--surface-container-low); text-align:left;
  display:flex; flex-direction:column; gap:2px}
.agent[aria-selected="true"]{background:var(--primary-container); color:var(--on-primary-container)}
.agent .l1{display:flex; align-items:center; gap:4px; font-size:12px; line-height:16px; font-weight:500}
.agent .dot{width:6px; height:6px; border-radius:50%; flex:none; background:var(--outline)}
.agent .l2{font-size:11px; line-height:16px; color:var(--on-surface-variant); overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.agent .dot[data-s="running"]{background:var(--primary)}
.agent .dot[data-s="completed"]{background:var(--tertiary)}
.agent .dot[data-s="failed"]{background:var(--error)}
.badge{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:50px;
  font-size:11px; line-height:16px; font-weight:500; background:var(--surface-container-high);
  color:var(--on-surface-variant)}
.badge[data-s="running"]{background:var(--primary-container); color:var(--on-primary-container)}
.badge[data-s="completed"]{background:var(--tertiary-container); color:var(--on-tertiary-container)}
.badge[data-s="failed"]{background:var(--error-container); color:var(--on-error-container)}

/* ============ 10. 工具详情侧滑面板（ToolDetailSidePanel：宽 42%，钳 360–560dp） ============ */
#toolpanel{position:absolute; inset:0; z-index:40; pointer-events:none}
#toolpanel .scrim{position:absolute; inset:0; background:var(--scrim); opacity:0;
  transition:opacity var(--dur) var(--ease-alpha)}
#toolpanel .panel{position:absolute; top:0; right:0; bottom:0; width:clamp(360px,42%,560px);
  background:var(--surface-container-low); border-radius:24px 0 0 24px; box-shadow:var(--shadow-2);
  transform:translateX(100%); transition:transform var(--dur) var(--ease-fancy);
  display:flex; flex-direction:column}
body[data-toolpanel="open"] #toolpanel{pointer-events:auto}
body[data-toolpanel="open"] #toolpanel .scrim{opacity:.32}
body[data-toolpanel="open"] #toolpanel .panel{transform:none}
#toolpanel .head{height:52px; display:flex; align-items:center; gap:8px; padding:0 8px 0 20px; flex:none;
  border-bottom:1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent)}
#toolpanel .head .t{flex:1; min-width:0; font-size:16px; line-height:24px; font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#toolpanel .body{flex:1; min-height:0; padding:12px 16px 20px; display:flex; flex-direction:column; gap:10px}
#toolpanel .closebtn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center}
#toolpanel .closebtn:hover{background:var(--surface-container-high)}

/* ============ 11. 子代理会话小窗（高 62%，从上方滑下，180ms） ============ */
#subagent{position:absolute; inset:0; z-index:45; pointer-events:none}
#subagent .scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; transition:opacity 180ms var(--ease-alpha)}
#subagent .win{position:absolute; top:0; left:0; right:0; height:62%; display:flex; flex-direction:column;
  background:var(--surface-container-low); border-radius:0 0 24px 24px; box-shadow:var(--shadow-2);
  transform:translateY(-100%); transition:transform 180ms var(--ease-fancy); overflow:hidden}
body[data-subagent="open"] #subagent{pointer-events:auto}
body[data-subagent="open"] #subagent .scrim{opacity:.32}
body[data-subagent="open"] #subagent .win{transform:none}
#subagent .head{display:flex; align-items:center; gap:8px; padding:12px 8px 12px 16px; flex:none;
  border-bottom:1px solid color-mix(in srgb, var(--outline-variant) 40%, transparent)}
#subagent .head .t{font-size:14px; line-height:20px; font-weight:500; flex:none}
#subagent .head .open{font-size:11px; line-height:16px; font-weight:500; color:var(--primary)}
#subagent .head .dot{width:8px; height:8px; border-radius:50%; background:var(--tertiary); margin-left:auto}
#subagent .body{flex:1; min-height:0; padding:8px; display:flex; flex-direction:column; gap:6px; overflow-y:auto}
#subagent .body .bubble{max-width:100%}

/* ============ 12. 设置：左栏 224dp + 中列 + 右列 ============ */
#settings{display:none; flex:1; min-width:0; position:relative; z-index:3}
body[data-screen="settings"] #settings{display:flex}
body[data-screen="settings"] #chatcol,body[data-screen="settings"] #drawer,
body[data-screen="settings"] #pane,body[data-screen="settings"] #quota{display:none!important}
#rail{display:none; width:224px; flex:none; flex-direction:column; gap:2px; padding:10px 8px;
  overflow-y:auto; background:color-mix(in srgb, var(--surface-container) 70%, transparent)}
body[data-mode="wide"] #rail{display:flex}
.rail-title{font-size:16px; line-height:24px; font-weight:500; padding:6px 12px 10px; color:var(--on-surface)}
.rail-g{font-size:11px; line-height:16px; font-weight:500; letter-spacing:.5px; color:var(--on-surface-variant);
  padding:10px 12px 4px}
.rail-i{display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:14px;
  font-size:14px; line-height:20px; font-weight:500; color:var(--on-surface); text-align:left}
.rail-i:hover{background:color-mix(in srgb, var(--on-surface) 7%, transparent)}
.rail-i[aria-current="true"]{background:var(--secondary-container); color:var(--on-secondary-container)}
.rail-i .icon{width:17px;height:17px}

#middle{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--topbar)}
body[data-mode="wide"] #middle{max-width:66%}
body[data-mode="wide"][data-split="on"] #middle{max-width:66%}
.topappbar{height:64px; flex:none; display:flex; align-items:center; gap:6px; padding:0 8px}
.topappbar .t{font-size:22px; line-height:28px; flex:1; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.iconbtn{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:var(--surface-bright); color:var(--on-surface)}
.iconbtn:hover{background:var(--surface-container-high)}
#settings-scroll{flex:1; min-height:0; padding:8px 16px 24px; display:flex; flex-direction:column; gap:16px}
.profile{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 16px}
.profile .big{width:88px; height:88px; border-radius:50%; display:grid; place-items:center;
  background:var(--tertiary-container); color:var(--on-tertiary-container); font-size:30px; font-weight:500}
.profile .nick{font-size:16px; line-height:24px; font-weight:500; padding:4px 12px; border-radius:50px}
.profile .nick:hover{background:color-mix(in srgb, var(--on-surface) 7%, transparent)}

/* Salt 分组：卡片 surfaceContainer，行 56/72dp，行间 hairline */
.salt-g{display:flex; flex-direction:column}
.salt-g > .gt{font-size:14px; line-height:20px; font-weight:500; color:var(--on-surface-variant);
  padding:0 4px 8px}
.salt-card{background:var(--surface-container); border-radius:var(--r-lg); overflow:hidden}
.salt-row{display:flex; align-items:center; gap:16px; width:100%; min-height:56px; padding:10px 16px;
  text-align:left; color:var(--on-surface)}
.salt-row.two{min-height:72px}
.salt-row + .salt-row{box-shadow:inset 0 1px 0 var(--outline-variant)}
.salt-row:hover{background:color-mix(in srgb, var(--on-surface) 5%, transparent)}
.salt-row .ic{color:var(--on-surface); flex:none}
.salt-row .txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.salt-row .t{font-size:16px; line-height:24px; letter-spacing:.5px}
.salt-row .s{font-size:14px; line-height:20px; letter-spacing:.25px; color:var(--on-surface-variant)}
.salt-row .chev{color:var(--on-surface-variant); flex:none}
.salt-row .cols{display:flex; flex-direction:column; gap:12px; width:100%}

/* CardGroup 行（子页）：首尾 20dp、中间 4dp、间距 2dp、无分隔线 */
.cg{display:flex; flex-direction:column; gap:2px}
.cg-row{display:flex; align-items:center; gap:16px; width:100%; padding:16px; text-align:left;
  background:var(--surface-bright); color:var(--on-surface); border-radius:4px}
.cg-row:first-child{border-radius:20px 20px 4px 4px}
.cg-row:last-child{border-radius:4px 4px 20px 20px}
.cg-row:only-child{border-radius:20px}
.cg-row:hover{background:color-mix(in srgb, var(--on-surface) 5%, var(--surface-bright))}
.cg-row .ico{width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--primary-container); color:var(--on-primary-container)}
.cg-row .txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.cg-row .t{font-size:16px; line-height:24px; letter-spacing:.5px}
.cg-row .s{font-size:14px; line-height:20px; letter-spacing:.25px; color:var(--on-surface-variant)}
.cg-row .v{flex:none; padding:4px 10px; border-radius:50px; background:var(--secondary-container);
  color:var(--on-secondary-container); font-size:14px; line-height:20px; font-weight:500;
  font-variant-numeric:tabular-nums}
.cg-title{font-size:14px; line-height:20px; font-weight:600; color:var(--primary); padding:8px 4px}

/* 右列（设置下钻页） */
#detail{display:none; flex:none; width:58%; min-width:320px; background:var(--topbar);
  border-left:1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent)}
/* 右列在宽屏是「从右边盖上来」：中列固定 66%，不改宽度、不重排（RouteActivity.kt） */
body[data-mode="wide"][data-split="on"] #detail{display:flex; flex-direction:column;
  position:absolute; top:0; right:0; bottom:0; width:58%}
body[data-mode="portrait"] #detail{display:none}
#detail .topappbar{height:56px}
#detail .topappbar .t{font-size:18px; line-height:24px}
#detail .body{flex:1; min-height:0; padding:8px 16px 24px; display:flex; flex-direction:column; gap:16px}
.hint-card{padding:16px; border-radius:var(--r-lg); background:var(--surface-container);
  color:var(--on-surface-variant); font-size:14px; line-height:20px}
/* 竖屏下钻：把 detail 当整页 */
body[data-mode="portrait"][data-page="detail"] #middle{display:none}
body[data-mode="portrait"][data-page="detail"] #detail{display:flex; flex-direction:column; width:100%;
  border-left:0}

/* ============ 13. 其余浮层 ============ */
#toasts{position:absolute; left:50%; bottom:96px; transform:translateX(-50%); z-index:70;
  display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{padding:12px 16px; border-radius:var(--r-xs); background:var(--inverse-surface);
  color:var(--inverse-on-surface); font-size:14px; line-height:20px; box-shadow:var(--shadow-2);
  animation:toastIn 200ms var(--ease-fancy)}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

#ctrl{position:fixed; right:16px; bottom:16px; z-index:90; display:flex; flex-direction:column; gap:8px;
  padding:10px; border-radius:18px; background:var(--glass); backdrop-filter:blur(20px);
  border:1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent); box-shadow:var(--shadow-2);
  width:228px; transition:opacity 200ms var(--ease-alpha)}
#ctrl.folded .body{display:none}
#ctrl .h{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
  color:var(--on-surface-variant)}
#ctrl .h .grow{flex:1}
#ctrl .row2{display:flex; flex-direction:column; gap:6px}
#ctrl label{font-size:11px; line-height:16px; color:var(--on-surface-variant)}
#ctrl .note{font-size:11px; line-height:15px; color:var(--on-surface-variant); opacity:.85}
#ctrl .segmented button{height:28px; font-size:12px; gap:4px}
#ctrl .segmented button .icon{width:13px;height:13px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:1ms!important; animation-iteration-count:1!important; transition-duration:1ms!important}
}


/* ============ 14. 空会话英雄卡与抬起来的输入区 ============ */
.hero{margin:0 40px; padding:24px 28px; display:flex; flex-direction:column; align-items:center;
  gap:12px; border-radius:28px; background:var(--surface-container-low); box-shadow:var(--shadow-1);
  animation:fadeIn 320ms var(--ease-alpha)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hero .big{width:88px; height:88px; border-radius:50%; display:grid; place-items:center;
  background:var(--primary-container); color:var(--on-primary-container); font-size:34px; font-weight:500}
.hero .slogan{margin:0; font-size:16px; line-height:24px; font-weight:500; letter-spacing:.15px;
  text-align:center; color:var(--on-surface)}
body[data-view="empty"] #chatcol{justify-content:center; padding-bottom:24px}
body[data-view="empty"] #topbar{position:absolute; top:0; left:0; right:0}
body[data-view="empty"] #list{flex:none; display:flex; justify-content:center; padding:0 0 16px; overflow:visible}
body[data-view="empty"] #quota{display:none}
.capsule .seg{width:45px; padding:0; justify-content:center}
.capsule .seg .name{width:auto; padding:0 8px}
.capsule .seg:has(.name){width:auto; padding:0 8px}
.sub-line{font-size:12px;line-height:16px;color:var(--on-surface-variant)}
.term{background:#0B0B0C; color:#D8DEE9; border-radius:12px; padding:10px 12px; font-family:var(--mono);
  font-size:12px; line-height:18px; white-space:pre-wrap; overflow:auto}
.term .p{color:#8FD48B}


/* ============ 15. 竖屏把右侧面板当浮层（原应用：详情浮层 0.75 高 / 任务树 Sheet） ============ */
body[data-mode="portrait"][data-pane="open"] #pane{display:flex; position:absolute; inset:8px;
  z-index:35; padding:0; min-width:0}
body[data-mode="portrait"][data-pane="open"] #pane .pane-card{box-shadow:var(--shadow-2)}
body[data-pane="open"] #scrim{opacity:.32; pointer-events:auto}

/* 消息入场（MessageEnterAnimation：追加时滑入） */
.msg{animation:msgIn 260ms var(--ease-fancy)}
@keyframes msgIn{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* 多选工具条（ChatSelectionToolbar：BottomCenter，offset −48dp） */
.selbar{position:absolute; left:50%; bottom:96px; transform:translateX(-50%); z-index:36;
  display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:16px;
  background:var(--surface-container); box-shadow:var(--shadow-2); animation:msgIn 200ms var(--ease-fancy)}
.selbar .c{font-size:12px; line-height:16px; font-weight:500; padding:0 6px}

/* AMOLED：暗色下表面整体压黑 */
html[data-theme="dark"] body[data-amoled="on"]{
  --background:#000000; --surface:#000000; --surface-dim:#000000;
  --surface-container-lowest:#050505; --surface-container-low:#0A0A0B;

  --surface-bright:#232325; --mesh-0:#0B0A10; --mesh-1:#08070C; --mesh-2:#050409;
  --mesh-3:#000000; --mesh-4:#000000}

    </div></div>`;

  const reasoning = m.reasoning ? `
    <div class="chain">
      <button class="step" data-expand="${rid}" aria-expanded="false">
        <span class="ic">${icon('i-brain', 's16')}</span>
        <span class="t">${esc(m.reasoning.title)}</span>
        <span class="dur">${m.reasoning.dur}s</span>

      <div class="detail" id="${rid}">${m.reasoning.text.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>
    </div>` : '';
  const tools = (m.tools || []).map((t, k) => `
    <div class="chain">
      <button class="step" data-tool="${i}" data-toolidx="${k}">
        <span class="ic">${icon('i-tool', 's16')}</span>
        <span class="t">${esc(t.title)}</span>

        ${icon('i-right', 's16 chev')}
      </button>
      <div class="prog"><i style="width:100%"></i></div>
    </div>`).join('');
  const actions = m.actions === false ? '' : `
    <div class="actions">
      <button title="复制" data-act="复制">${icon('i-copy', 's18')}</button>
      <button title="重新生成" data-act="重新生成">${icon('i-refresh', 's18')}</button>

      <span class="branch">${icon('i-left', 's12')}1/2${icon('i-right', 's12')}</span>
      <span class="time">14:26</span>

  const nerd = m.nerd ? `<div class="nerd">${m.nerd.map((l, k) =>
    `<div class="r">${icon(k === 0 ? 'i-refresh' : 'i-layers', 's12')}${esc(l)}</div>`).join('')}</div>` : '';
  const edited = m.edited ? `
    <div class="edited" aria-expanded="false">
      <button class="h" data-toggle="edited">${icon('i-file', 's16')}
        <span class="t">文件变更</span><span class="c">${m.edited.length} 个文件</span>
        ${icon('i-down', 's16 chev')}</button>
      <div class="body">${m.edited.map(f => `<div class="f">${icon('i-file', 's12')}${esc(f.p)}

    </div>` : '';
  return `<div class="msg ai ${i ? 'role-change' : ''}">
    <div class="mhead"><span class="avatar ai">默</span><span class="mname">${esc(m.name || '默认助手')}</span></div>
    ${reasoning}${tools}
    ${m.html || m.streaming ? `<div class="bubble">${m.html || ''}</div>` : ''}
    ${actions}${nerd}${edited}
  </div>`;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;

}

/* 菜单：锚在某个元素上，点外部关闭 */
function closeMenus() { $$('.menu').forEach(m => m.remove()); }
function openMenu(anchor, html, align = 'right') {
  closeMenus();
  const r = anchor.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = html;
  document.body.appendChild(m);
  const w = m.offsetWidth;
  let left = align === 'right' ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  m.style.left = left + 'px';
  m.style.top = (r.bottom + 6) + 'px';
  m.style.position = 'fixed';
  return m;
}

/* ---------------- 发送与流式 ---------------- */
let busy = false;

function grow() {
  const t = $('#input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 144) + 'px';
}

function updateSend() {
  const has = $('#input').value.trim().length > 0;
  const btn = $('#sendbtn');
  const st = busy ? (has ? 'send' : 'stop') : (has ? 'send' : 'disabled');
  btn.dataset.state = st;
  btn.title = st === 'stop' ? '停止' : '发送';
  btn.innerHTML = icon(st === 'stop' ? 'i-stop' : 'i-send', 's18');
}

function mdLite(text) {
  const blocks = esc(text).split(/\n\n+/);
  return blocks.map(b => {
    const lines = b.split('\n');
    if (lines.every(l => l.startsWith('- '))) {
      return '<ul>' + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
    }
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
  function inline(s) {
    return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
}

function streamReply() {
  busy = true; updateSend();
  const msg = { role: 'ai', name: '默认助手', html: '', streaming: true, actions: false };
  chat.messages.push(msg);
  renderChat();
  const full = '收到。只剩一条进度条，读模型上的 MAX：到 80% 转提醒色，满格转 `error` 并拦住发送。\n\n- 占用取最近一次回复的 `prompt + completion`\n- 没设 MAX 时整块不显示\n\n本轮只动了计量组件与输入栏的传参，没有碰发送拦截点。';
  let i = 0;
  const tick = () => {
    i = Math.min(full.length, i + 2);
    msg.html = mdLite(full.slice(0, i));
    renderChat();
    if (i < full.length) setTimeout(tick, 22);
    else {
      msg.streaming = false;
      msg.actions = true;
      msg.nerd = ['12.6K 上下文（已缓存 8.4K）'];
      busy = false;
      renderChat(); updateSend();
    }
  };
  setTimeout(tick, 380);
}

function send() {
  const ta = $('#input');
  const text = ta.value.trim();
  if (!text) return;
  if (state.view === 'empty') {
    chat.messages.length = 0; chat.title = '新聊天'; state.view = 'messages';
    paint(); /* 空态把顶栏绝对定位、输入区居中，发首条要换回常规布局 */
  }
  chat.messages.push({ role: 'user', text });
  ta.value = ''; grow(); updateSend();
  renderChat();
  streamReply();
}

function newChat() {
  chatStore[state.activeId] = chat.messages.slice();
  state.activeId = null;
  chat.messages = [];
  chat.title = '新聊天';
  state.view = 'empty';
  state.drawer = false;
  renderChat(); renderDrawer(); paint();
  $('#input').focus();
}

const chatStore = {};

function openConv(id) {
  if (state.activeId) chatStore[state.activeId] = chat.messages.slice();
  state.activeId = id;
  const c = conversations[id];
  chat.title = c.title;
  if (chatStore[id]) chat.messages = chatStore[id].slice();
  else if (id === 'c1') { /* 默认样本已就位 */ }
  else {
    chat.messages = [
      { role: 'user', text: '继续上次的改动。' },
      { role: 'ai', name: '默认助手', html: mdLite(`上次停在「${c.title}」。这一轮先把范围收一下。`), nerd: ['2.1K 上下文'] },
    ];
  }
  state.view = 'messages';
  state.drawer = false;
  renderChat(); renderDrawer(); paint();
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', (e) => {
  const hit = (s) => e.target.closest(s);

  const mi = hit('.menu .mi');
  if (mi && !mi.hasAttribute('disabled')) setTimeout(closeMenus, 0);

  if (!hit('.menu') && !hit('#btn-more') && !hit('#pane-add') && !hit('#sort-btn') && !hit('#folder-btn')) closeMenus();

  if (hit('#menu-btn')) {
    if (state.mode === 'portrait') state.drawer = !state.drawer; else state.sidebar = !state.sidebar;
    paint(); return;
  }
  if (hit('#scrim')) {
    if (state.paneOpen) { state.paneOpen = false; } else { state.drawer = false; }
    paint(); return;
  }
  if (hit('[data-conv]')) { openConv(hit('[data-conv]').dataset.conv); return; }
  if (hit('#newchat2') || hit('#btn-new')) { newChat(); return; }
  if (hit('#me-btn')) { state.screen = 'settings'; state.section = null; state.detail = null; renderMiddle(); renderDetail(); paint(); return; }
  if (hit('#settings-back')) {
    if (state.section) { state.section = null; state.detail = null; renderMiddle(); renderRail(); renderDetail(); }
    else { state.screen = 'chat'; paint(); }
    return;
  }
  if (hit('[data-section]')) {
    state.section = hit('[data-section]').dataset.section;
    state.detail = null;
    renderRail(); renderMiddle(); renderDetail(); paint();
    return;
  }
  if (hit('[data-go]')) {
    const go = hit('[data-go]').dataset.go;
    if (go === 'theme') { state.detail = 'theme'; renderDetail(); paint(); }
    else { state.section = go; state.detail = null; renderRail(); renderMiddle(); renderDetail(); paint(); }
    return;
  }
  if (hit('#detail-back')) { state.detail = null; renderDetail(); paint(); return; }
  if (hit('[data-switch]')) {
    const b = hit('[data-switch]');
    const on = b.getAttribute('aria-checked') === 'true';
    b.setAttribute('aria-checked', String(!on));
    if (b.dataset.switch === 'amoled') { state.amoled = !on; paint(); }
    else toast(on ? '动态颜色：已关闭，改用内置调色板' : '动态颜色：跟随壁纸');
    return;
  }
  if (hit('[data-colormode]') && hit('[data-colormode]').dataset.colormode) {
    const m = hit('[data-colormode]').dataset.colormode;
    if (m === 'system') { toast('颜色模式：跟随系统'); }
    else { state.theme = m; paint(); renderMiddle(); }
    return;
  }
  if (hit('#btn-more')) {
    const has = state.view === 'messages' && chat.messages.length > 0;
    openMenu(hit('#btn-more'), `
      <button class="mi" ${has ? '' : 'disabled'}>${icon('i-flow', 's18')}对话地图</button>
      <button class="mi" data-more="export" ${has ? '' : 'disabled'}>${icon('i-ext', 's18')}导出</button>
      <div class="sep"></div>
      <button class="mi danger" ${has ? '' : 'disabled'}>${icon('i-close', 's18')}删除</button>`);
    return;
  }
  if (hit('[data-more="export"]')) {
    closeMenus();
    showSelbar();
    return;
  }
  if (hit('#btn-details')) { openPane('详情'); return; }
  if (hit('#btn-tree')) { openPane('任务树'); return; }
  if (hit('#btn-attach')) { openPane('附件与工具'); return; }
  if (hit('#btn-quick')) { toast('快捷消息：原型未收录菜单'); return; }
  if (hit('#sort-btn')) {
    openMenu(hit('#sort-btn'), `
      <button class="mi">${icon('i-check', 's18')}按更新时间</button>
      <button class="mi" style="padding-left:44px">按创建时间</button>`);
    return;
  }
  if (hit('#folder-btn')) {
    openMenu(hit('#folder-btn'), `
      <div class="mh">会话文件夹</div>
      <button class="mi">未归类 ${icon('i-check', 's18')}</button>
      <button class="mi">${icon('i-folder', 's18')}渲染</button>
      <button class="mi">${icon('i-folder', 's18')}运行时</button>
      <div class="sep"></div>
      <button class="mi">${icon('i-plus', 's18')}新建文件夹</button>`);
    return;
  }
  if (hit('[data-shortcut-search]')) { e.stopPropagation(); toast('搜索聊天'); return; }
  if (hit('[data-shortcut]')) { toast(shortcuts[hit('[data-shortcut]').dataset.shortcut].t + '：原型未展开'); return; }
  if (hit('#assistant-row')) { toast('助手选择 Sheet：原型未展开'); return; }
  if (hit('[data-expand]')) {
    const id = hit('[data-expand]').dataset.expand;
    const card = hit('[data-expand]').closest('.chain');
    const open = hit('[data-expand]').getAttribute('aria-expanded') === 'true';
    hit('[data-expand]').setAttribute('aria-expanded', String(!open));
    $('#' + id).classList.toggle('open', !open);
    return;
  }
  if (hit('[data-toggle]')) {
    const card = hit('[data-toggle]').closest('[aria-expanded]');
    card.setAttribute('aria-expanded', card.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    return;
  }
  if (hit('[data-tool]')) { openTool(+hit('[data-tool]').dataset.tool, +hit('[data-tool]').dataset.toolidx); return; }
  if (hit('[data-act]')) { toast(hit('[data-act]').dataset.act); return; }
  if (hit('[data-noop]')) { toast(hit('[data-noop]').closest('.cg-row').querySelector('.t').textContent + '：原型未展开'); return; }
  if (hit('[data-closetab]')) {
    const name = hit('[data-closetab]').dataset.closetab;
    state.tabs = state.tabs.filter(x => x !== name);
    if (!state.tabs.length) { state.paneOpen = false; }
    else if (state.tab === name) state.tab = state.tabs[state.tabs.length - 1];
    renderPane(); paint();
    return;
  }
  if (hit('[data-tab]')) { state.tab = hit('[data-tab]').dataset.tab; renderPane(); return; }
  if (hit('#pane-add')) {
    openMenu(hit('#pane-add'), `<div class="mh">新建标签页</div>` +
      paneTitles.map(t => `<button class="mi" data-addtab="${t}">${icon('i-plus', 's18')}${t}</button>`).join(''));
    return;
  }
  if (hit('[data-addtab]')) { closeMenus(); openPane(hit('[data-addtab]').dataset.addtab); return; }
  if (hit('[data-agent]')) { state.treeSel = +hit('[data-agent]').dataset.agent; renderPane(); return; }
  if (hit('#open-sa')) { openSubAgent(); return; }
  if (hit('#sa-open')) { state.subagent = false; paint(); toast('打开完整会话'); return; }
  if (hit('[data-close]')) { state[hit('[data-close]').dataset.close] = false; paint(); return; }
  if (hit('#ctrl-fold')) { $('#ctrl').classList.toggle('folded'); return; }
  if (hit('#ctrl-mode button')) { state.mode = hit('#ctrl-mode button').dataset.mode; paint(); return; }
  if (hit('#ctrl-theme button')) { state.theme = hit('#ctrl-theme button').dataset.theme; paint(); return; }
  if (hit('#sendbtn')) {
    if (busy && !$('#input').value.trim()) { busy = false; toast('已停止'); updateSend(); return; }
    send(); return;
  }
});

$('#input').addEventListener('input', () => { grow(); updateSend(); });
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeMenus();
  if (state.subagent) state.subagent = false;
  else if (state.toolpanel) state.toolpanel = false;
  else if (state.paneOpen) state.paneOpen = false;
  else if (state.drawer) state.drawer = false;
  paint();
});

function showSelbar() {
  $$('.selbar').forEach(x => x.remove());
  const bar = document.createElement('div');
  bar.className = 'selbar';
  bar.innerHTML = `<button class="iact" data-selbar="cancel" title="清除选择">${icon('i-close', 's18')}</button>
    <span class="c">已选 ${Math.max(chat.messages.length, 1)} 项</span>
    <button class="btn text" data-selbar="all">取消全选</button>
    <button class="btn tonal" data-selbar="ok" style="height:32px">确认</button>`;
  bar.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-selbar]');
    if (!b) return;
    const k = b.dataset.selbar;
    if (k === 'ok') toast('已打开导出表');
    bar.remove();
  });
  $('#chatcol').appendChild(bar);
}

/* ---------------- 启动 ---------------- */
renderDrawer(); renderChat(); renderRail(); renderMiddle(); renderDetail(); renderPane();
paint(); grow(); updateSend();
</script>
</body>
</html>
