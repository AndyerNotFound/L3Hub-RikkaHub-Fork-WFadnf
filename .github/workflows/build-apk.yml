name: Build APK

# 四条通道共用一套流程，按 tag 形态与事件区分：
#   v3.1.1              → 正式版：githubRelease 变体，包名不带后缀，正式 Release
#   v3.3.0.2            → 正式版（四段）：同一条线上再补一版，versionName 与 tag 完全一致
#   Canary-Build        → Canary：githubRelease 变体 + .canary 包名，Pre-release
#   Nightly-Build       → 每夜构建：githubDebug 变体 + .debug 包名，Pre-release
#   v3.1.1-preview.102  → 旧预览通道：githubDebug 变体 + .debug 包名，Pre-release
# 正式版出两个 APK：完整版（含 LiteRT-LM 运行时）与精简版（文件名带 -nolitert，不含），
# 同包名、同版本号、同签名；测试通道只出精简版。
# Nightly 另有 schedule：每天把 Nightly-Build 挪到默认分支 HEAD 并覆盖资产。
# 正式版与 Canary 用 Secrets 里的 release key，Nightly / 预览用仓库里的 debug key，
# 见 FORK.md「发版」一节。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空只出 artifact 不发版；不带 - 为正式版，Canary-Build 为 .canary 测试通道，Nightly-Build 为 .debug 每夜构建，其余带 - 的为旧预览通道）'
        required: false
        default: ''
      variant:
        description: '构建变体'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - release
          - debug
  push:
    tags: ['v*', 'Canary-Build', 'Nightly-Build']
  schedule:
    # 每天 19:00 UTC，即北京时间次日 03:00。GitHub 高峰期可能推迟十几分钟。
    - cron: '0 19 * * *'

concurrency:
  group: build-apk-${{ github.ref }}-${{ inputs.tag }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发填了 tag 时，要编的是那个 tag 的提交；否则会拿分支 HEAD 出的包挂到 tag 上
          ref: ${{ inputs.tag || github.ref }}
          # 发布说明要用 git log 取出上一个 tag 到本 tag 的提交，浅克隆拿不到
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 变体、tag、是否 prerelease 全在第一步定下来：后面的步骤只读环境变量，
      # 不用把 ${{ }} 判断散在各处
      - name: Resolve build parameters
        id: params
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VARIANT: ${{ inputs.variant }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # 每夜构建没有 tag 可读，固定落到 Nightly-Build 这个滚动 tag 上
            tag=Nightly-Build
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="${INPUT_TAG:-}"
          fi
          # 首字符 - 会被 gh 当 flag；/ 和空格会让 cp 写进不存在的目录。
          # 空 tag 是合法输入：手动触发只出 artifact、不发版
          case "$tag" in
            '' ) ;;
            -*|*[!A-Za-z0-9._-]*)
              echo "非法 tag：[${tag}]" >&2
              exit 1 ;;
          esac

          # 渠道决定包名、签名与出几个包：
          #   stable  v3.1.1               正式版，release 变体，包名不带后缀，完整版 + 精简版
          #   canary  Canary-Build         测试通道，release 变体 + .canary 包名，只出精简版
          #   nightly Nightly-Build        每夜构建，debug 变体 + .debug 包名（buildType 自带），只出精简版
          #   preview v3.1.1-preview.102   旧的独立包名预览通道，debug 变体，只出精简版
          #   manual  （空 tag）            只出 artifact、不发版，变体由输入决定
          channel=preview
          rolling=false
          case "$tag" in
            '') channel=manual ;;
            Nightly-Build) channel=nightly; rolling=true ;;
            Canary-Build) channel=canary; rolling=true ;;
            *-canary*) channel=canary ;;
            *-*) channel=preview ;;
            *) channel=stable ;;
          esac
          case "$channel" in
            stable|manual) is_pre=false ;;
            *) is_pre=true ;;
          esac
          is_canary=false
          is_nightly=false
          if [ "$channel" = "canary" ]; then is_canary=true; fi
          if [ "$channel" = "nightly" ]; then is_nightly=true; fi

          # 滚动通道不带版本号，永远指向最新构建；带版本号的 Canary 仍要卡形态，
          # 否则版本号核对会把它当成别的 base 前缀匹配
          if [ "$channel" = "canary" ] && [ "$rolling" != "true" ] \
             && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
            echo "canary tag ${tag} 应形如 vX.Y.Z-canary.N" >&2
            exit 1
          fi

          variant="${INPUT_VARIANT:-auto}"
          if [ "$variant" = "auto" ]; then
            case "$channel" in
              stable|canary) variant=release ;;
              *) variant=debug ;;
            esac
          fi
          # 包名与签名必须和 tag 语义对得上：正式版出成 debug 包会换掉应用身份（老用户
          # 再也覆盖安装不了），Canary 出成 debug 会丢掉 .canary 的约定，Nightly 出成
          # release 会丢掉 .debug 包名、与正式版撞身份
          case "$channel" in
            stable)
              if [ "$variant" != "release" ]; then
                echo "正式版 tag ${tag} 必须用 release 变体" >&2
                exit 1
              fi ;;
            canary)
              if [ "$variant" != "release" ]; then
                echo "canary tag ${tag} 必须用 release 变体" >&2
                exit 1
              fi ;;
            nightly)
              if [ "$variant" != "debug" ]; then
                echo "Nightly 必须用 debug 变体，包名才带 .debug" >&2
                exit 1
              fi ;;
            preview)
              if [ "$variant" != "debug" ]; then
                echo "预览版 tag ${tag} 必须用 debug 变体" >&2
                exit 1
              fi ;;
          esac

          # 包名后缀与桌面名由 gradle 属性注入，变体名与产物目录都不变
          app_id_suffix=""
          app_label=""
          case "$channel" in
            canary) app_id_suffix=".canary"; app_label="L3Hub Canary" ;;
            nightly) app_label="L3Hub Nightly" ;;
            preview) app_label="L3Hub Preview" ;;
          esac

          # 正式版出完整版 + 精简版各一个；测试通道只出精简版，
          # 本机推理用不着，少编一遍也少等十分钟。
          # 空 tag 的手动触发不是发布通道，保持原来的行为：release 出两个包，
          # debug 只出完整包，方便单独验证 LiteRT。
          build_full=true
          build_nolitert=true
          case "$channel" in
            canary|nightly|preview) build_full=false ;;
            manual)
              if [ "$variant" = "debug" ]; then build_nolitert=false; fi ;;
          esac

          {
            echo "CHANNEL=$channel"
            echo "VARIANT=$variant"
            echo "TAG=$tag"
            echo "IS_PRERELEASE=$is_pre"
            echo "IS_CANARY=$is_canary"
            echo "IS_NIGHTLY=$is_nightly"
            echo "ROLLING=$rolling"
            echo "APP_ID_SUFFIX=$app_id_suffix"
            echo "APP_LABEL=$app_label"
            echo "BUILD_FULL=$build_full"
            echo "BUILD_NOLITERT=$build_nolitert"
          } >> "$GITHUB_ENV"
          artifact="L3Hub-${variant}"
          if [ -n "$tag" ]; then artifact="${artifact}-${tag}"; fi
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"
          echo "渠道=$channel 变体=$variant tag=${tag:-（无，只出 artifact）} prerelease=$is_pre 完整版=$build_full 精简版=$build_nolitert"

      # 版本号没有第二处校验：versionName 只被读出来当文案，tag 打错或忘了改版本号
      # 都能绿着发出去，装到手机上却是同一个 versionCode。这里把两者对一次。
      - name: Check version against tag
        run: |
          set -euo pipefail
          # Nightly 由 schedule 触发，远端 tag 还没挪过来；先建成本地 tag，
          # 后面的 tag 解析与 head 计算才有一致的对象（推送在 Publish 前单独做）
          if [ "$IS_NIGHTLY" = "true" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            git tag -f "$TAG" HEAD
          fi
          if [ -z "${TAG:-}" ]; then
            echo "没有 tag（只出 artifact），跳过版本号校验"
            exit 0
          fi
          if [ ! -f app/build.gradle.kts ]; then
            echo "当前提交里没有 app/build.gradle.kts，tag ${TAG} 指错地方了？" >&2
            exit 1
          fi
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "没读到 versionCode / versionName，app/build.gradle.kts 的格式变了？" >&2
            exit 1
          fi
          # tag 解析不到（打错、浅克隆没拿到）说明 checkout 的 ref 和 TAG 不是一回事，
          # 下面「找不到上一个 tag 就跳过」会把这种情况一起吞掉，先在这里拦下
          if ! git rev-parse --verify --quiet "${TAG}^{commit}" >/dev/null; then
            echo "tag ${TAG} 解析不到，无法核对版本号" >&2
            exit 1
          fi
          # 少打一段（v3.1）会跟 L.3.1.6.107 前缀匹配上，先卡形态。
          # 四段 vX.Y.Z.W 表示同一条线上再补一版（前三段不动），同样算正式版
          case "$TAG" in
            *-*) ;;
            *)
              if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "正式版 tag ${TAG} 不是 vX.Y.Z 或 vX.Y.Z.W 形式" >&2
                exit 1
              fi ;;
          esac
          # v3.1.6 → 3.1.6；v3.1.1-preview.102 → 3.1.1
          # 滚动通道（Canary-Build / Nightly-Build）的 tag 不带版本号，versionName 只读
          # build.gradle.kts，不与 tag 前缀核对。
          if [ "${ROLLING}" != "true" ]; then
            base=${TAG#v}
            base=${base%%-*}
            # 三段 tag 走 L.<base>.NNN，末段是构建序号；四段 tag 直接用 L.<base> 与 tag 对齐
            case "$name" in
              "L.${base}"|"L.${base}."*) ;;
              *)
                echo "versionName「${name}」和 tag ${TAG} 对不上，应形如 L.${base} 或 L.${base}.NNN" >&2
                exit 1 ;;
            esac
          else
            echo "滚动通道 ${CHANNEL}，跳过 versionName 前缀核对：versionName=${name}"
          fi
          # 测试通道都是独立包名，versionCode 和正式版撞车不影响谁覆盖谁，
          # 只核对 versionName，别为了打个测试包还得先 bump 版本号。
          # 只有正式版需要保证 versionCode 递增。
          if [ "$CHANNEL" != "stable" ]; then
            echo "非正式版通道（${CHANNEL}），只核对 versionName：${name}"
            exit 0
          fi
          # 正式版 versionCode 不涨，覆盖安装只是重装同一个版本，用户会以为没更新成功
          prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${TAG}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "没有上一个正式版 tag，跳过 versionCode 递增校验；versionName=${name}"
            exit 0
          fi
          # 前序 tag 上可能根本没有这个文件（早于模块拆分），git show 会非零退出，
          # set -e 下整个 job 就死在 git 的 fatal 上，先探一下
          if ! git cat-file -e "${prev}:app/build.gradle.kts" 2>/dev/null; then
            echo "::warning::${prev} 上没有 app/build.gradle.kts，跳过 versionCode 递增校验"
            exit 0
          fi
          prev_code=$(git show "${prev}:app/build.gradle.kts" \
            | sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' | head -1)
          if [ -z "$prev_code" ]; then
            echo "::warning::没从 ${prev} 读到 versionCode，跳过递增校验"
            exit 0
          fi
          if [ "$code" -le "$prev_code" ]; then
            echo "versionCode ${code} 没有大于 ${prev} 的 ${prev_code}" >&2
            exit 1
          fi
          echo "versionName=${name} versionCode=${code} > ${prev} 的 ${prev_code}"

      # 预览版用仓库里固定的 debug key（keystore/l3hub-debug.jks），正式版用 Secrets 里的
      # release key。build.gradle.kts 的 release 签名只认 local.properties，这里按变体写进去。
      - name: Restore signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" != "release" ]; then
            echo "debug 变体（Nightly / 预览版）签的是仓库里的 keystore/l3hub-debug.jks，不用还原密钥"
            exit 0
          fi
          # 四个都必须是真值：build.gradle.kts 只判 null，而 Properties.load 把「storePassword=」
          # 读成空串，一路走到 validateSigning 才报「keystore 口令不对」，看不出是 secret 没配
          for name in ANDROID_RELEASE_KEYSTORE ANDROID_RELEASE_STORE_PASSWORD \
                      ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "缺少 secret：${name}" >&2
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/l3hub-release.jks"
          # 网页上粘 base64 常带换行，GNU base64 -d 遇到就 invalid input 退出，报错完全不提 secret
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | tr -d ' \t\r\n' | base64 -d > "$ks"
          chmod 600 "$ks"
          if ! keytool -list -keystore "$ks" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
               -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "keystore 解不开：口令或 alias 和 secret 对不上" >&2
            exit 1
          fi
          {
            echo "storeFile=$ks"
            echo "storePassword=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_RELEASE_KEY_ALIAS"
            echo "keyPassword=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> local.properties
          echo "release keystore 已还原到 $ks"

      # :terminal / :workspace 带 CMake，AGP 每次配置阶段都要 NDK 28.2.13676358（约 700MB）。
      # 上一次「Error reading Zip content from a SeekableByteChannel」就是这份下载被截断，
      # 还没走到底就红了。缓存住这个目录，之后不再依赖一次性下载。
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-ubuntu

      # 缓存是固定 key，一次下载截断被存进去就会一直命中坏副本。
      # 每次跑之前验一下，不全就删掉让 AGP 重下（重下约 16 秒，比修一个坏缓存便宜）。
      - name: Validate NDK
        run: |
          ndk=/usr/local/lib/android/sdk/ndk/28.2.13676358
          if [ -e "$ndk" ] && { [ ! -f "$ndk/source.properties" ] || \
             [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; }; then
            echo "缓存里的 NDK 不完整，删掉重新下载"
            rm -rf "$ndk"
          fi

      - uses: pnpm/action-setup@v4
        with:
          # web-ui/pnpm-workspace.yaml 只有 allowBuilds（pnpm 10.26+ 的字段），没有 packages:，
          # pnpm 9 会报 "packages field missing or empty"，所以这里必须用 pnpm 11。
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          # 本地默认跳过 Web UI；CI 装上 pnpm 后把它一起打进包，避免 APK 里缺 static/assets
          WITH_WEB_UI: '1'
          # gradle.properties 的 kotlin.daemon.jvmargs 是照本机 8G 定的 1.5g；出包要连着编
          # 完整版和精简版两遍，编译后端的临时图会在 1.5g 上撞 GC overhead limit。
          # runner 上先抬到 3g；P1–P2-4 之后 :app 的 inline 展开更大，3g 在
          # compileGithubReleaseKotlin 的 codegen.inline 里 OOM，标准 runner 16G，抬到 6g。
          ORG_GRADLE_PROJECT_kotlin.daemon.jvmargs: '-Xmx6g'
        run: |
          set -euo pipefail
          chmod +x gradlew tools/build-apk.sh
          # 产物名里用 tag；手动触发不填 tag 时退回 versionName，免得叫 L3Hub-arm64-v8a.apk
          if [ -n "${TAG:-}" ]; then
            tag_for_name="$TAG"
          else
            tag_for_name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          fi
          echo "TAG_FOR_NAME=$tag_for_name" >> "$GITHUB_ENV"
          mkdir -p dist

          # 同一个变体编两遍，输出目录和文件名都一样：编完立刻按最终名字拷进 dist 再清掉，
          # 第二遍的产物才不会把第一遍盖掉
          build_apk() {
            local variant="$1"
            local suffix="$2"
            shift 2
            echo "== 构建${suffix:-完整版}（${variant}） =="
            VARIANT="$variant" ./tools/build-apk.sh "$@"
            local dir="app/build/outputs/apk/github/${variant}"
            mapfile -t apks < <(ls "$dir"/*.apk)
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "期望恰好 1 个 APK，实际 ${#apks[@]} 个：${apks[*]:-无}" >&2
              return 1
            fi
            cp "${apks[0]}" "dist/L3Hub-${tag_for_name}-arm64-v8a${suffix}.apk"
            rm -rf "$dir"
          }

          # 包名后缀与桌面名只由测试通道注入；正式版这两个参数为空，产物与历史一致
          app_args=()
          if [ -n "${APP_ID_SUFFIX:-}" ]; then
            app_args+=("-PappIdSuffix=${APP_ID_SUFFIX}")
          fi
          if [ -n "${APP_LABEL:-}" ]; then
            app_args+=("-PappLabel=${APP_LABEL}")
          fi

          # 精简版 = 不打包 LiteRT-LM 运行时，见 :ai / :app 的 build.gradle.kts
          if [ "$BUILD_FULL" = "true" ]; then
            build_apk "$VARIANT" "" "${app_args[@]}"
          fi
          if [ "$BUILD_NOLITERT" = "true" ]; then
            build_apk "$VARIANT" "-nolitert" -PnoLitert=true "${app_args[@]}"
          fi

          ls -l dist

      # 正式版换了包名和签名密钥，这一步把「装到手机上到底是什么」打进日志，
      # 出问题时不用重新下载 APK 就能核对
      - name: Verify APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "dist/ 里没有 APK" >&2
            exit 1
          fi
          cert_release=""
          cert_debug=""
          for apk in "${apks[@]}"; do
            apk_name=$(basename "$apk")
            echo "== ${apk_name}（$(du -h "$apk" | cut -f1)）=="
            "${build_tools}apksigner" verify --print-certs "$apk"
            # 一次运行只出一种通道，包名与签名都按渠道核对
            if [ "$VARIANT" = "release" ]; then group=release; else group=debug; fi
            case "$CHANNEL" in
              canary) want=com.rikkahub.l3hub.wfadnf.canary ;;
              nightly|preview) want=com.rikkahub.l3hub.wfadnf.debug ;;
              *) want=com.rikkahub.l3hub.wfadnf ;;
            esac
            pkg=$("${build_tools}aapt2" dump packagename "$apk" | tail -1)
            if [ "$pkg" != "$want" ]; then
              echo "包名对不上：${pkg} ≠ ${want}" >&2
              exit 1
            fi
            echo "包名：${pkg}"
            "${build_tools}aapt2" dump badging "$apk" 2>/dev/null \
              | grep -E '^(package|application-label|sdkVersion|targetSdkVersion)' || true
            # apksigner 不同版本打的前缀不一样（Signer #1 certificate… / V2 Signer: certificate…），
            # 只认后面那截
            apk_cert=$("${build_tools}apksigner" verify --print-certs "$apk" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
            if [ -z "$apk_cert" ]; then
              echo "没读到签名证书指纹，apksigner 输出格式变了？" >&2
              exit 1
            fi
            apk_cert=$(printf '%s' "$apk_cert" | tr -d ':' | tr 'A-Z' 'a-z')
            echo "签名证书 SHA-256：${apk_cert}"
            if [ "$group" = "release" ]; then
              # 完整版与精简版要能互相覆盖安装，签名必须完全一致
              if [ -n "$cert_release" ] && [ "$apk_cert" != "$cert_release" ]; then
                echo "两个正式包的签名证书不一致：${apk_cert} ≠ ${cert_release}" >&2
                exit 1
              fi
              cert_release="$apk_cert"
              # 正式版换密钥就等于换应用身份（老用户再也覆盖安装不了），指纹对不上要在这里红。
              # 真要换密钥，连这一行和 FORK.md 里的指纹一起改。
              want_cert=0ed133055246d7231888e72197f29fa616a65367de875042108f9d417b583542
              if [ "$apk_cert" != "$want_cert" ]; then
                echo "正式版签名证书指纹不符：${apk_cert} ≠ ${want_cert}" >&2
                exit 1
              fi
            else
              # 调试包用仓库里的 l3hub-debug.jks，指纹不写死；只要求同组的几个包一致
              if [ -n "$cert_debug" ] && [ "$apk_cert" != "$cert_debug" ]; then
                echo "两个调试包的签名证书不一致：${apk_cert} ≠ ${cert_debug}" >&2
                exit 1
              fi
              cert_debug="$apk_cert"
            fi
          done
          if [ -n "$cert_release" ]; then echo "CERT_SHA256=$cert_release" >> "$GITHUB_ENV"; fi

      # Gradle 产出的名字是 app-github-arm64-v8a-release.apk，下载下来分不清版本。
      # 重命名与拷贝在 Build 里已经做完（同一变体要编两遍，晚了会被覆盖），这里只补 sha256。
      - name: Collect APK
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            ( cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256" )
          done
          echo "产物：$TAG_FOR_NAME"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.artifact }}
          # 连 .sha256 一起带：手动触发只出包时也能拿到校验文件
          path: dist/*
          if-no-files-found: error

      # Nightly 的 tag 每次都要指向当夜的提交：release 页面的源码快照、下次构建计算
      # 改动区间都靠它。schedule 没有 tag 可推，这里补上；GITHUB_TOKEN 推的 tag 不会
      # 触发新的 workflow，不会自己再跑一轮。
      - name: Move rolling tag
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git tag -f "$TAG" "$(git rev-parse HEAD)"
          git push --force origin "refs/tags/$TAG"
          echo "已把 $TAG 挪到 $(git rev-parse --short HEAD)"

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本仓库不走 PR，GitHub 的 --generate-notes 只会给一行 Full Changelog。
          # 自己按「上一个 tag..这个 tag」列提交，读的人才知道这版改了什么。
          # 正式版要排除预览版 tag（v3.1.1-preview.102 也是 tag），否则区间从上一个预览版
          # 开始算，正式版之间真正的改动整段消失；预览版反过来要留在预览 tag 之间，
          # 否则区间被拉回上一个正式版，把已经随正式版发过的改动重列一遍。
          if [ "$IS_PRERELEASE" = "true" ]; then
            prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${TAG}^" 2>/dev/null || true)
          fi
          head=$(git rev-parse "${TAG}^{commit}")
          # 滚动 tag 每次都被挪到新提交上，git 里查不到「上次从这里发的是哪个提交」，
          # 只看 tag 会把上一个版本 tag 以来的改动整段重列一遍。上一版发的是哪个提交、
          # 从哪算起，都记在上一版说明的 HTML 注释里，下次生成时读回来。
          # head 与本次相同说明是同一个提交重跑，沿用那次算出的起点，说明才不会退化成空。
          if [ "$ROLLING" = "true" ]; then
            key=canary
            if [ "$IS_NIGHTLY" = "true" ]; then key=nightly; fi
            note=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
            last=$(printf '%s\n' "$note" \
              | sed -n "s/.*${key}:from=[0-9a-f]* head=\([0-9a-f]\{7,40\}\) -->.*/\1/p" | head -1)
            base=$(printf '%s\n' "$note" \
              | sed -n "s/.*${key}:from=\([0-9a-f]\{7,40\}\) head=.*/\1/p" | head -1)
            if [ "$last" = "$head" ]; then
              prev=$base
            else
              prev=${last:-$base}
            fi
            # 强推改了 tag 之后老提交可能已经不在仓库里，git log 会直接报错退出
            if [ -n "$prev" ] && ! git cat-file -e "${prev}^{commit}" 2>/dev/null; then
              echo "::warning::上一版说明记录的提交 ${prev} 不在仓库里，退回按 tag 取区间"
              prev=
            fi
            if [ -z "$prev" ]; then
              prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            fi
            echo "滚动通道 ${CHANNEL} 的改动起点：${prev:-（无，首个版本）}"
            # 记进说明的一律是提交 sha：起点可能是 tag 名，下次读回来要能直接喂给 git log
            prev_sha=""
            if [ -n "$prev" ]; then prev_sha=$(git rev-parse "${prev}^{commit}"); fi
          fi
          case "$CHANNEL" in
            canary) pkg=com.rikkahub.l3hub.wfadnf.canary ;;
            nightly|preview) pkg=com.rikkahub.l3hub.wfadnf.debug ;;
            *) pkg=com.rikkahub.l3hub.wfadnf ;;
          esac
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          {
            echo "## 本版改动"
            echo
            if [ -n "$prev" ]; then
              # 只留改到应用本身的提交：ci / test / build 作用域（含 `fix(ci):` 这种）、
              # 以及发版时的版本号 bump 都是仓库内部的事，读 Release 的人不关心
              changes=$(git log --no-merges --pretty='- %s' "${prev}..${TAG}" \
                | grep -vE '^- (ci|test|build)(\(|:)|^- [[:alnum:]_-]+\((ci|test|build)\):|^- chore: bump version' || true)
              if [ -n "$changes" ]; then
                # 两个正式版之间可能隔着两百个提交，整段贴上去没人读得完；
                # 前 60 条足够看出主线，剩下的让读者顺着完整对比看
                total=$(printf '%s\n' "$changes" | wc -l | tr -d ' ')
                printf '%s\n' "$changes" | sed -n '1,60p'
                if [ "$total" -gt 60 ]; then
                  echo
                  echo "（只列前 60 条，其余 $((total - 60)) 条见下方完整对比）"
                fi
              else
                echo "- 只有内部改动（CI / 构建 / 版本号），没有影响使用的变化"
              fi
              echo
              echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            else
              echo "- 首个版本"
            fi
            echo
            echo "## 安装"
            echo
            if [ "$BUILD_FULL" = "true" ]; then
              echo '`L3Hub-'"${TAG}"'-arm64-v8a.apk` — 完整版，含 LiteRT-LM 本地推理运行时，可在应用内直接跑 `.litertlm` 模型。'
              echo
            fi
            if [ "$BUILD_NOLITERT" = "true" ]; then
              echo '`L3Hub-'"${TAG}"'-arm64-v8a-nolitert.apk` — 精简版，不含 LiteRT-LM 运行时，体积更小；其余功能与完整版一致，只是本地模型入口不显示。'
              echo
            fi
            if [ "$BUILD_FULL" = "true" ] && [ "$BUILD_NOLITERT" = "true" ]; then
              echo '两个正式包同包名、同版本号、同签名，只能装一个；换装另一个直接覆盖安装即可，应用数据保留。'
              echo
            fi
            echo '包名 `'"${pkg}"'`，版本 `'"${version}"'`，arm64-v8a。'
            echo
            case "$CHANNEL" in
              stable)
                echo 'Canary 的包名是 `'"${pkg}"'.canary`，Nightly 的是 `'"${pkg}"'.debug`，都与正式版是独立应用，可同装在一台手机上，互不覆盖数据。'
                echo
                echo '从测试通道迁过来：在那边导出备份，装正式版后导入即可；备份里的附件、字体路径会按新包名自动改写。'
                ;;
              canary)
                echo '这是 Canary 预发布：功能比正式版新，稳定性不作保证。'
                echo
                echo '包名带 `.canary` 后缀，与正式版 `com.rikkahub.l3hub.wfadnf` 是两个独立应用，可同装，数据互不影响；测试通道只出精简版。'
                echo
                echo 'Canary 的 versionCode 不随构建递增：同一 versionCode 的包可以互相覆盖；需要把数据带回正式版时，用备份导出与导入。'
                ;;
              nightly)
                echo '这是 Nightly 预发布：每夜自动构建，功能比正式版新，稳定性不作保证。'
                echo
                echo '包名带 `.debug` 后缀，与正式版是两个独立应用，可同装；测试通道只出精简版。'
                echo
                echo '资产每夜被下一版同名覆盖，同一 versionCode 的构建可直接覆盖安装；回退到更早的构建，装上一版的 APK 即可。'
                echo
                echo '构建提交 `'"$(git rev-parse --short HEAD)"'`，构建时间 `'"$(date -u '+%Y-%m-%d %H:%M UTC')"'`。'
                ;;
              preview)
                echo '这是旧预览通道的构建：包名带 `.debug` 后缀，与正式版是独立应用，可同装；只出精简版。'
                ;;
            esac
            echo
            for apk in dist/*.apk; do
              printf '校验：`sha256sum -c %s.sha256`\n' "$(basename "$apk")"
            done
            if [ -n "${CERT_SHA256:-}" ]; then
              echo
              echo '签名证书 SHA-256：`'"${CERT_SHA256}"'`'
            fi
            # 下一次滚动构建从这一行读起点，别把注释删掉
            if [ "$ROLLING" = "true" ]; then
              echo
              echo "<!-- ${key}:from=${prev_sha} head=${head} -->"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          # 幂等：release 已存在（重跑、或夜间覆盖）就覆盖资产并刷新说明，不要整个 job 失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产并刷新说明"
            # 产物名可能和上一版不一样，只 clobber 同名的会把旧包一直留在下载列表里，
            # 先删掉这次没有的
            for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if [ ! -f "dist/$name" ]; then
                echo "删除过期资产：$name"
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
            # --draft=false：同名 release 停在草稿状态时，只改说明会让它永远发不出去，而 job 是绿的
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --prerelease="$IS_PRERELEASE" --draft=false
          else
            flags=()
            if [ "$IS_PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            # --verify-tag：tag 不存在时直接报错，不要拿 GITHUB_SHA 现造一个，
            # 否则「手动触发 + 打错 tag」会凭空多出一个和代码无关的版本
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag "${flags[@]}"
          fi

      # local.properties 里是明文口令，keystore 也有临时副本，都别留在工作区等后续步骤/缓存捡走
      - name: Clear secrets
        if: always()
        run: |
          rm -f local.properties RELEASE_NOTES.md
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -f "$RUNNER_TEMP/l3hub-release.jks"; fi
