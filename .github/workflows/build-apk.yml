name: Build APK

# 三条线共用一套流程，按 tag 形态区分：
#   v3.1.1              → 正式版：githubRelease 变体（包名不带 .debug），正式 Release
#   v3.1.1-canary.1     → Canary 版：githubRelease 变体，包名与签名同正式版，Pre-release
#   v3.1.1-preview.102  → 预览版：githubDebug 变体（包名 .debug），Pre-release
# 正式版签名密钥放在仓库 Secrets，见 FORK.md「发版」一节。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空只出 artifact 不发版；不带 - 为正式版，-canary.N 为同包名同签名的 Canary 预发布，其余带 - 的为独立包名的预览版）'
        required: false
        default: ''
      variant:
        description: '构建变体'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - release
          - debug
  push:
    tags: ['v*', 'Canary-Build']

concurrency:
  group: build-apk-${{ github.ref }}-${{ inputs.tag }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发填了 tag 时，要编的是那个 tag 的提交；否则会拿分支 HEAD 出的包挂到 tag 上
          ref: ${{ inputs.tag || github.ref }}
          # 发布说明要用 git log 取出上一个 tag 到本 tag 的提交，浅克隆拿不到
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 变体、tag、是否 prerelease 全在第一步定下来：后面的步骤只读环境变量，
      # 不用把 ${{ }} 判断散在各处
      - name: Resolve build parameters
        id: params
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VARIANT: ${{ inputs.variant }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="${INPUT_TAG:-}"
          fi
          # 首字符 - 会被 gh 当 flag；/ 和空格会让 cp 写进不存在的目录。
          # 空 tag 是合法输入：手动触发只出 artifact、不发版
          case "$tag" in
            '' ) ;;
            -*|*[!A-Za-z0-9._-]*)
              echo "非法 tag：[${tag}]" >&2
              exit 1 ;;
          esac
          # tag 带 -（canary / preview / rc）算预发布，不带 - 算正式版
          case "$tag" in
            *-*) is_pre=true ;;
            *) is_pre=false ;;
          esac
          # canary 是预发布，但沿用正式版包名与签名：装上去就是覆盖正式版，数据沿用。
          # 其余带 - 的 tag 仍是独立包名的预览版（.debug + 仓库里的 debug key）。
          is_canary=false
          # 滚动 Canary（固定 tag Canary-Build）不带版本号，永远指向最新构建，语义同 canary：
          # release 变体、正式包名与签名、Prerelease，可覆盖安装正式版。
          rolling_canary=false
          if [ "$tag" = "Canary-Build" ]; then
            rolling_canary=true
          fi
          if [ "$is_pre" = "true" ]; then
            case "$tag" in
              *-canary*|Canary-Build)
                is_canary=true
                # 形态不对会被下面的版本号核对当成别的 base 前缀匹配，先卡死写法；
                # 滚动 Canary 不带版本号，不做形态校验
                if [ "$rolling_canary" != "true" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
                  echo "canary tag ${tag} 应形如 vX.Y.Z-canary.N" >&2
                  exit 1
                fi ;;
            esac
          fi
          variant="${INPUT_VARIANT:-auto}"
          if [ "$variant" = "auto" ]; then
            if [ "$is_canary" = "true" ]; then
              variant=release
            else
              case "$tag" in
                ''|*-*) variant=debug ;;
                *) variant=release ;;
              esac
            fi
          fi
          # 正式版包套上预览 tag 会发成正式 Release，包名/签名和 tag 对不上，事后只能重发
          if [ "$variant" = "debug" ] && [ "$is_pre" = "false" ] && [ -n "$tag" ]; then
            echo "tag ${tag} 不带 -，是正式版，必须用 release 变体；只要预览包请用带 - 的 tag" >&2
            exit 1
          fi
          # canary 的卖点就是覆盖安装正式版；出成 debug 包等于换了个应用，更新落在别的包名上
          if [ "$is_canary" = "true" ] && [ "$variant" != "release" ]; then
            echo "canary tag ${tag} 必须用 release 变体，包名与签名才和正式版一致" >&2
            exit 1
          fi
          {
            echo "VARIANT=$variant"
            echo "TAG=$tag"
            echo "IS_PRERELEASE=$is_pre"
            echo "IS_CANARY=$is_canary"
            echo "ROLLING_CANARY=$rolling_canary"
          } >> "$GITHUB_ENV"
          artifact="L3Hub-${variant}"
          if [ -n "$tag" ]; then artifact="${artifact}-${tag}"; fi
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"
          echo "变体=$variant tag=${tag:-（无，只出 artifact）} prerelease=$is_pre"

      # 版本号没有第二处校验：versionName 只被读出来当文案，tag 打错或忘了改版本号
      # 都能绿着发出去，装到手机上却是同一个 versionCode。这里把两者对一次。
      - name: Check version against tag
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "没有 tag（只出 artifact），跳过版本号校验"
            exit 0
          fi
          if [ ! -f app/build.gradle.kts ]; then
            echo "当前提交里没有 app/build.gradle.kts，tag ${TAG} 指错地方了？" >&2
            exit 1
          fi
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "没读到 versionCode / versionName，app/build.gradle.kts 的格式变了？" >&2
            exit 1
          fi
          # tag 解析不到（打错、浅克隆没拿到）说明 checkout 的 ref 和 TAG 不是一回事，
          # 下面「找不到上一个 tag 就跳过」会把这种情况一起吞掉，先在这里拦下
          if ! git rev-parse --verify --quiet "${TAG}^{commit}" >/dev/null; then
            echo "tag ${TAG} 解析不到，无法核对版本号" >&2
            exit 1
          fi
          # 少打一段（v3.1）会跟 L.3.1.6.107 前缀匹配上，先卡形态
          case "$TAG" in
            *-*) ;;
            *)
              if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "正式版 tag ${TAG} 不是 vX.Y.Z 形式" >&2
                exit 1
              fi ;;
          esac
          # v3.1.6 → 3.1.6；v3.1.1-preview.102 → 3.1.1
          # 滚动 Canary 的 tag 不带版本号，versionName 只读 build.gradle.kts，不与 tag 前缀核对；
          # 下面的 versionCode 递增校验照常，保证能覆盖已装的正式版。
          if [ "${ROLLING_CANARY}" != "true" ]; then
            base=${TAG#v}
            base=${base%%-*}
            case "$name" in
              "L.${base}."*) ;;
              *)
                echo "versionName「${name}」和 tag ${TAG} 对不上，应形如 L.${base}.NNN" >&2
                exit 1 ;;
            esac
          else
            echo "滚动 Canary，跳过 versionName 前缀核对：versionName=${name}"
          fi
          # 预览版是独立包名（.debug），versionCode 和正式版撞车不影响谁覆盖谁，
          # 只核对 versionName，别为了打个预览包还得先 bump 版本号。
          # canary 用的是正式版包名，versionCode 不涨就装不上已装的正式版，下面照常核对。
          if [ "$VARIANT" = "debug" ]; then
            echo "预览版 tag，只核对 versionName：${name}"
            exit 0
          fi
          # 正式版 versionCode 不涨，覆盖安装只是重装同一个版本，用户会以为没更新成功
          prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${TAG}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "没有上一个正式版 tag，跳过 versionCode 递增校验；versionName=${name}"
            exit 0
          fi
          # 前序 tag 上可能根本没有这个文件（早于模块拆分），git show 会非零退出，
          # set -e 下整个 job 就死在 git 的 fatal 上，先探一下
          if ! git cat-file -e "${prev}:app/build.gradle.kts" 2>/dev/null; then
            echo "::warning::${prev} 上没有 app/build.gradle.kts，跳过 versionCode 递增校验"
            exit 0
          fi
          prev_code=$(git show "${prev}:app/build.gradle.kts" \
            | sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' | head -1)
          if [ -z "$prev_code" ]; then
            echo "::warning::没从 ${prev} 读到 versionCode，跳过递增校验"
            exit 0
          fi
          if [ "$code" -le "$prev_code" ]; then
            echo "versionCode ${code} 没有大于 ${prev} 的 ${prev_code}" >&2
            exit 1
          fi
          echo "versionName=${name} versionCode=${code} > ${prev} 的 ${prev_code}"

      # 预览版用仓库里固定的 debug key（keystore/l3hub-debug.jks），正式版用 Secrets 里的
      # release key。build.gradle.kts 的 release 签名只认 local.properties，这里按变体写进去。
      - name: Restore signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$VARIANT" != "release" ]; then
            echo "预览版签的是仓库里的 keystore/l3hub-debug.jks，不用还原密钥"
            exit 0
          fi
          # 四个都必须是真值：build.gradle.kts 只判 null，而 Properties.load 把「storePassword=」
          # 读成空串，一路走到 validateSigning 才报「keystore 口令不对」，看不出是 secret 没配
          for name in ANDROID_RELEASE_KEYSTORE ANDROID_RELEASE_STORE_PASSWORD \
                      ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "缺少 secret：${name}" >&2
              exit 1
            fi
          done
          ks="$RUNNER_TEMP/l3hub-release.jks"
          # 网页上粘 base64 常带换行，GNU base64 -d 遇到就 invalid input 退出，报错完全不提 secret
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | tr -d ' \t\r\n' | base64 -d > "$ks"
          chmod 600 "$ks"
          if ! keytool -list -keystore "$ks" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
               -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "keystore 解不开：口令或 alias 和 secret 对不上" >&2
            exit 1
          fi
          {
            echo "storeFile=$ks"
            echo "storePassword=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_RELEASE_KEY_ALIAS"
            echo "keyPassword=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> local.properties
          echo "release keystore 已还原到 $ks"

      # :terminal / :workspace 带 CMake，AGP 每次配置阶段都要 NDK 28.2.13676358（约 700MB）。
      # 上一次「Error reading Zip content from a SeekableByteChannel」就是这份下载被截断，
      # 还没走到底就红了。缓存住这个目录，之后不再依赖一次性下载。
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-ubuntu

      # 缓存是固定 key，一次下载截断被存进去就会一直命中坏副本。
      # 每次跑之前验一下，不全就删掉让 AGP 重下（重下约 16 秒，比修一个坏缓存便宜）。
      - name: Validate NDK
        run: |
          ndk=/usr/local/lib/android/sdk/ndk/28.2.13676358
          if [ -e "$ndk" ] && { [ ! -f "$ndk/source.properties" ] || \
             [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; }; then
            echo "缓存里的 NDK 不完整，删掉重新下载"
            rm -rf "$ndk"
          fi

      - uses: pnpm/action-setup@v4
        with:
          # web-ui/pnpm-workspace.yaml 只有 allowBuilds（pnpm 10.26+ 的字段），没有 packages:，
          # pnpm 9 会报 "packages field missing or empty"，所以这里必须用 pnpm 11。
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          # 本地默认跳过 Web UI；CI 装上 pnpm 后把它一起打进包，避免 APK 里缺 static/assets
          WITH_WEB_UI: '1'
        run: |
          set -euo pipefail
          chmod +x gradlew tools/build-apk.sh
          ./tools/build-apk.sh
          ls -l "app/build/outputs/apk/github/${VARIANT}"/*.apk
          sha256sum "app/build/outputs/apk/github/${VARIANT}"/*.apk

      # 正式版换了包名和签名密钥，这一步把「装到手机上到底是什么」打进日志，
      # 出问题时不用重新下载 APK 就能核对
      - name: Verify APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          apk=$(ls "app/build/outputs/apk/github/${VARIANT}"/*.apk)
          build_tools=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          "${build_tools}apksigner" verify --print-certs "$apk"
          # 变体选错（正式版签成了 debug 包之类）在这里就红，不要等发出去才发现
          pkg=$("${build_tools}aapt2" dump packagename "$apk" | tail -1)
          want=com.rikkahub.l3hub.wfadnf
          if [ "$VARIANT" = "debug" ]; then want="${want}.debug"; fi
          if [ "$pkg" != "$want" ]; then
            echo "包名对不上：${pkg} ≠ ${want}" >&2
            exit 1
          fi
          echo "包名：${pkg}"
          "${build_tools}aapt2" dump badging "$apk" 2>/dev/null \
            | grep -E '^(package|application-label|sdkVersion|targetSdkVersion)' || true
          # apksigner 不同版本打的前缀不一样（Signer #1 certificate… / V2 Signer: certificate…），
          # 只认后面那截
          cert=$("${build_tools}apksigner" verify --print-certs "$apk" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
          if [ -z "$cert" ]; then
            echo "没读到签名证书指纹，apksigner 输出格式变了？" >&2
            exit 1
          fi
          cert=$(printf '%s' "$cert" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "签名证书 SHA-256：${cert}"
          if [ "$VARIANT" = "release" ]; then
            # 正式版换密钥就等于换应用身份（老用户再也覆盖安装不了），指纹对不上要在这里红。
            # 真要换密钥，连这一行和 FORK.md 里的指纹一起改。
            want_cert=0ed133055246d7231888e72197f29fa616a65367de875042108f9d417b583542
            if [ "$cert" != "$want_cert" ]; then
              echo "正式版签名证书指纹不符：${cert} ≠ ${want_cert}" >&2
              exit 1
            fi
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      # Gradle 产出的名字是 app-github-arm64-v8a-release.apk，下载下来分不清版本。
      # 这里按 tag 重命名，并附一份 sha256 供校验。
      - name: Collect APK
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            # 只出 artifact 时按 build.gradle.kts 的 versionName 命名，否则产物会叫 L3Hub-arm64-v8a.apk
            TAG="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          echo "产物 tag：$TAG"

          mkdir -p dist
          mapfile -t apks < <(ls "app/build/outputs/apk/github/${VARIANT}"/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "期望恰好 1 个 APK，实际 ${#apks[@]} 个：${apks[*]:-无}" >&2
            exit 1
          fi
          cp "${apks[0]}" "dist/L3Hub-${TAG}-arm64-v8a.apk"
          ( cd dist && sha256sum "L3Hub-${TAG}-arm64-v8a.apk" > "L3Hub-${TAG}-arm64-v8a.apk.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.artifact }}
          # 连 .sha256 一起带：手动触发只出包时也能拿到校验文件
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本仓库不走 PR，GitHub 的 --generate-notes 只会给一行 Full Changelog。
          # 自己按「上一个 tag..这个 tag」列提交，读的人才知道这版改了什么。
          # 正式版要排除预览版 tag（v3.1.1-preview.102 也是 tag），否则区间从上一个预览版
          # 开始算，正式版之间真正的改动整段消失；预览版反过来要留在预览 tag 之间，
          # 否则区间被拉回上一个正式版，把已经随正式版发过的改动重列一遍。
          if [ "$IS_PRERELEASE" = "true" ]; then
            prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            prev=$(git describe --tags --abbrev=0 --exclude='*-*' "${TAG}^" 2>/dev/null || true)
          fi
          head=$(git rev-parse "${TAG}^{commit}")
          # 滚动 tag 每次都被挪到新提交上，git 里查不到「上次从这里发的是哪个提交」，
          # 只看 tag 会把上一个版本 tag 以来的改动整段重列一遍。上一版发的是哪个提交、
          # 从哪算起，都记在上一版说明的 HTML 注释里，下次生成时读回来。
          # head 与本次相同说明是同一个提交重跑，沿用那次算出的起点，说明才不会退化成空。
          if [ "$ROLLING_CANARY" = "true" ]; then
            note=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
            last=$(printf '%s\n' "$note" \
              | sed -n 's/.*canary:from=[0-9a-f]* head=\([0-9a-f]\{7,40\}\) -->.*/\1/p' | head -1)
            base=$(printf '%s\n' "$note" \
              | sed -n 's/.*canary:from=\([0-9a-f]\{7,40\}\) head=.*/\1/p' | head -1)
            if [ "$last" = "$head" ]; then
              prev=$base
            else
              prev=${last:-$base}
            fi
            # 强推改了 tag 之后老提交可能已经不在仓库里，git log 会直接报错退出
            if [ -n "$prev" ] && ! git cat-file -e "${prev}^{commit}" 2>/dev/null; then
              echo "::warning::上一版说明记录的提交 ${prev} 不在仓库里，退回按 tag 取区间"
              prev=
            fi
            if [ -z "$prev" ]; then
              prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            fi
            echo "滚动 Canary 的改动起点：${prev:-（无，首个版本）}"
            # 记进说明的一律是提交 sha：起点可能是 tag 名，下次读回来要能直接喂给 git log
            prev_sha=""
            if [ -n "$prev" ]; then prev_sha=$(git rev-parse "${prev}^{commit}"); fi
          fi
          pkg=com.rikkahub.l3hub.wfadnf
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          {
            echo "## 本版改动"
            echo
            if [ -n "$prev" ]; then
              # 只留改到应用本身的提交：ci / test / build、以及发版时的版本号 bump
              # 都是仓库内部的事，读 Release 的人不关心
              changes=$(git log --no-merges --pretty='- %s' "${prev}..${TAG}" \
                | grep -vE '^- (ci|test|build)(\(|:)|^- chore: bump version' || true)
              if [ -n "$changes" ]; then
                echo "$changes"
              else
                echo "- 只有内部改动（CI / 构建 / 版本号），没有影响使用的变化"
              fi
              echo
              echo "**完整对比**：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            else
              echo "- 首个版本"
            fi
            echo
            echo "## 安装"
            echo
            if [ "$IS_CANARY" = "true" ]; then
              echo '`L3Hub-'"${TAG}"'-arm64-v8a.apk` — arm64-v8a Canary 版，包名 `'"${pkg}"'`，版本 `'"${version}"'`，签名与正式版相同。'
              echo
              echo '这是预发布：功能比正式版新，稳定性不作保证。它和正式版是同一个应用，装上会直接覆盖已装的正式版并沿用其数据。'
              echo
              if [ "$ROLLING_CANARY" = "true" ]; then
                echo '滚动 Canary 的 versionCode 不随构建递增：同一 versionCode 的包可以互相覆盖，要回退到上一次构建，装它的 APK 即可；回退到 versionCode 更低的正式版仍需先卸载（会清除应用数据，建议先导出备份）。'
              else
                echo 'versionCode 只增不减：装过这一版之后，要回到更早的正式版只能先卸载（会清除应用数据，建议先导出备份）。'
              fi
            elif [ "$VARIANT" = "release" ]; then
              echo '`L3Hub-'"${TAG}"'-arm64-v8a.apk` — arm64-v8a 正式版，包名 `'"${pkg}"'`，版本 `'"${version}"'`。'
              echo
              echo '和预览版（包名 `'"${pkg}"'.debug`）是两个独立的应用，可以同装在一台手机上，互不覆盖数据。'
              echo
              echo '从预览版迁过来：在预览版里导出备份，装正式版后导入即可；备份里的附件、字体路径会按新包名自动改写。'
            else
              echo '`L3Hub-'"${TAG}"'-arm64-v8a.apk` — arm64-v8a 预览版，包名 `'"${pkg}"'.debug`，版本 `'"${version}"'`，覆盖安装即可。'
            fi
            echo
            echo '校验：`sha256sum -c L3Hub-'"${TAG}"'-arm64-v8a.apk.sha256`'
            if [ -n "${CERT_SHA256:-}" ]; then
              echo
              echo '签名证书 SHA-256：`'"${CERT_SHA256}"'`'
            fi
            # 下一次滚动构建从这一行读起点，别把注释删掉
            if [ "$ROLLING_CANARY" = "true" ]; then
              echo
              echo "<!-- canary:from=${prev_sha} head=${head} -->"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          # 幂等：release 已存在（重跑、或手动发过）就覆盖资产并刷新说明，不要整个 job 失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖资产并刷新说明"
            gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
            # --draft=false：同名 release 停在草稿状态时，只改说明会让它永远发不出去，而 job 是绿的
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --prerelease="$IS_PRERELEASE" --draft=false
          else
            flags=()
            if [ "$IS_PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            # --verify-tag：tag 不存在时直接报错，不要拿 GITHUB_SHA 现造一个，
            # 否则「手动触发 + 打错 tag」会凭空多出一个和代码无关的版本
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag "${flags[@]}"
          fi

      # local.properties 里是明文口令，keystore 也有临时副本，都别留在工作区等后续步骤/缓存捡走
      - name: Clear secrets
        if: always()
        run: |
          rm -f local.properties RELEASE_NOTES.md
          if [ -n "${RUNNER_TEMP:-}" ]; then rm -f "$RUNNER_TEMP/l3hub-release.jks"; fi
