name: CI

# 本机环境不执行编译，全部验证由本工作流承担。
# 仅运行单元测试，不产出安装包；出包与发版仍由 build-apk.yml（tag 触发）负责。
on:
  # 打 tag 时 build-apk.yml 会在同一代码上再次执行构建，此处仅监听分支，避免重复消耗 runner
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # :terminal / :workspace 带 CMake，配置阶段需要 NDK 28.2.13676358（约 700MB）。
      # 不缓存时每次均需现下载，且曾出现下载损坏（Error reading Zip content）导致整轮失败。
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-ubuntu

      - name: Validate NDK
        run: |
          ndk=/usr/local/lib/android/sdk/ndk/28.2.13676358
          if [ -e "$ndk" ] && { [ ! -f "$ndk/source.properties" ] || \
             [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; }; then
            echo "缓存中的 NDK 不完整，删除后重新下载"
            rm -rf "$ndk"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run unit tests
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        # 1) :web:preBuild 依赖 buildWebUi（需 pnpm），单元测试不使用前端产物，予以跳过
        # 2) 仅运行 githubDebug 一个变体：gradle.properties 的 JVM 上限按本机 8G 内存设定
        #    （heap 3g / kotlin daemon 1.5g），执行 ./gradlew test 会构建 app 的全部四个变体，
        #    在 runner 上直接 OOM。此处显式列出任务，并将 kotlin daemon 提升至 3g。
        run: |
          ./gradlew \
            :app:testGithubDebugUnitTest \
            :ai:testDebugUnitTest \
            :extension-api:testDebugUnitTest \
            :search:testDebugUnitTest \
            :workspace:testDebugUnitTest \
            :document:testDebugUnitTest \
            :speech:testDebugUnitTest \
            :ui:testDebugUnitTest \
            :common:testDebugUnitTest \
            :oauth:testDebugUnitTest \
            :mediagen:testDebugUnitTest \
            :syncproto:testDebugUnitTest \
            :datacenter:testDebugUnitTest \
            -Pkotlin.daemon.jvmargs=-Xmx3g \
            -x :web:buildWebUi \
            --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

  # web-ui 的构建仅在发版时执行，日常 Kotlin 单测不覆盖该部分。
  # 此处单独运行类型检查，使前端改动（尤其是后端 DTO 同步）在 PR 阶段即可暴露问题。
  web-ui:
    name: Web UI typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web-ui
        run: pnpm run typecheck
