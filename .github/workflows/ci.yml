name: CI

# 本机不能编译，所有验证都走这里。
# 只跑单测，不出包；出包/发版仍由 build-apk.yml（打 tag 触发）负责。
on:
  # 打 tag 时 build-apk.yml 会在同一份代码上再跑一遍构建，这里只盯分支，别重复烧 runner
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # :terminal / :workspace 带 CMake，配置阶段就要 NDK 28.2.13676358（约 700MB）。
      # 不缓存的话每次都要现下，下坏一次（Error reading Zip content）整轮就红。
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358-ubuntu

      - name: Validate NDK
        run: |
          ndk=/usr/local/lib/android/sdk/ndk/28.2.13676358
          if [ -e "$ndk" ] && { [ ! -f "$ndk/source.properties" ] || \
             [ ! -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; }; then
            echo "缓存里的 NDK 不完整，删掉重新下载"
            rm -rf "$ndk"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run unit tests
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        # 1) :web:preBuild 依赖 buildWebUi（要 pnpm），单测用不到前端产物，跳过
        # 2) 只跑 githubDebug 一个变体：gradle.properties 里的 JVM 上限是照本机 8G 定的
        #    （heap 3g / kotlin daemon 1.5g），跑 ./gradlew test 会把 app 的四个变体都编一遍，
        #    在 runner 上直接 OOM。这里显式列出任务，并把 kotlin daemon 抬到 3g。
        run: |
          ./gradlew \
            :app:testGithubDebugUnitTest \
            :ai:testDebugUnitTest \
            :search:testDebugUnitTest \
            :workspace:testDebugUnitTest \
            :document:testDebugUnitTest \
            :speech:testDebugUnitTest \
            :ui:testDebugUnitTest \
            :common:testDebugUnitTest \
            :oauth:testDebugUnitTest \
            :mediagen:testDebugUnitTest \
            -Pkotlin.daemon.jvmargs=-Xmx3g \
            -x :web:buildWebUi \
            --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn

  # web-ui 的构建只在发版时跑，平时的 Kotlin 单测看不到它。
  # 这里单独跑类型检查，前端改动（尤其是后端 DTO 同步）在 PR 阶段就能红。
  web-ui:
    name: Web UI typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web-ui
        run: pnpm run typecheck
